name: Build and Push Runner Images to Registry

permissions:
  contents: read

on:
  push:
    branches: [ "integration" ]
    paths:
      - "images/**"
  workflow_dispatch:
    inputs:
      runner_u20:
        description: "Build Ubuntu 20.04 (arc-runner-set-u20)"
        required: false
        type: boolean
        default: true
      runner_u22:
        description: "Build Ubuntu 22.04 (arc-runner-set-u22)"
        required: false
        type: boolean
        default: true
      runner_ol8:
        description: "Build Oracle Linux 8 (arc-runner-set-ol8)"
        required: false
        type: boolean
        default: true
      runner_ol9:
        description: "Build Oracle Linux 9 (arc-runner-set-ol9)"
        required: false
        type: boolean
        default: true
      runner_rhel8:
        description: "Build RHEL 8 (arc-runner-set-rhel8)"
        required: false
        type: boolean
        default: true
      runner_rhel9:
        description: "Build RHEL 9 (arc-runner-set-rhel9)"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      runner_u20:
        description: "Build Ubuntu 20.04 (arc-runner-set-u20)"
        required: false
        type: boolean
        default: true
      runner_u22:
        description: "Build Ubuntu 22.04 (arc-runner-set-u22)"
        required: false
        type: boolean
        default: true
      runner_ol8:
        description: "Build Oracle Linux 8 (arc-runner-set-ol8)"
        required: false
        type: boolean
        default: true
      runner_ol9:
        description: "Build Oracle Linux 9 (arc-runner-set-ol9)"
        required: false
        type: boolean
        default: true
      runner_rhel8:
        description: "Build RHEL 8 (arc-runner-set-rhel8)"
        required: false
        type: boolean
        default: true
      runner_rhel9:
        description: "Build RHEL 9 (arc-runner-set-rhel9)"
        required: false
        type: boolean
        default: true

env:
  REGISTRY_ADDRESS: ${{ secrets.REGISTRY_ADDRESS }}
  REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  PIP_INDEX: ${{ secrets.PIP_INDEX }}

jobs:
  setup:
    runs-on: arc-runner-set-u22
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Build OS Matrix
        id: build-matrix
        run: |
          # Use bash string manipulation to build the array (avoids needing jq)
          MATRIX="["

          # Default to true on push events (when inputs are null/empty)
          if [ "${{ github.event_name == 'push' || inputs.runner_u20 == true }}" == "true" ]; then MATRIX="$MATRIX\"ubuntu-20\","; fi
          if [ "${{ github.event_name == 'push' || inputs.runner_u22 == true }}" == "true" ]; then MATRIX="$MATRIX\"ubuntu-22\","; fi
          if [ "${{ github.event_name == 'push' || inputs.runner_ol8 == true }}" == "true" ]; then MATRIX="$MATRIX\"oraclelinux-8\","; fi
          if [ "${{ github.event_name == 'push' || inputs.runner_ol9 == true }}" == "true" ]; then MATRIX="$MATRIX\"oraclelinux-9\","; fi

          # Strip the trailing comma and close the array bracket
          MATRIX="${MATRIX%,}]"

          # If nothing was selected, output an empty valid JSON array
          if [ "$MATRIX" == "]" ]; then MATRIX="[]"; fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-and-push-ol8:
    name: Build and Push ${{ matrix.os_image }}
    needs: setup
    if: ${{ needs.setup.outputs.matrix != '[]' }}
    runs-on: arc-runner-set-ol8

    strategy:
      fail-fast: false
      matrix:
        os_image: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Login to container registry
        run: |
          echo "${{ env.REGISTRY_PASSWORD }}" | sudo buildah login ${{ env.REGISTRY_ADDRESS }} --username "${{ env.REGISTRY_NAMESPACE }}" --password-stdin

      - name: Build the container image
        run: |
          cd images && \
          make buildah-build \
            PIP_INDEX=${{ env.PIP_INDEX }} \
            OS_IMAGE=${{ matrix.os_image }} \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images

      - name: Push the container image
        run: |
          cd images && \
          make buildah-push \
            OS_IMAGE=${{ matrix.os_image }} \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images

      - name: Buildah Logout
        if: ${{ always() }}
        run: sudo buildah logout ${{ env.REGISTRY_ADDRESS }}

  build-and-push-rhel8:
    name: Build and Push RHEL 8
    runs-on: arc-runner-set-rhel8
    if: ${{ github.event_name == 'push' || inputs.runner_rhel8 == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Login to container registry
        run: |
          echo "${{ env.REGISTRY_PASSWORD }}" | sudo buildah login ${{ env.REGISTRY_ADDRESS }} --username "${{ env.REGISTRY_NAMESPACE }}" --password-stdin

      - name: Build the container image
        run: |
          cd images && \
          make buildah-build-rhel \
            PIP_INDEX=${{ env.PIP_INDEX }} \
            OS_IMAGE=rhel-8 \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images

      - name: Push the container image
        run: |
          cd images && \
          make buildah-push \
            OS_IMAGE=rhel-8 \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images

      - name: Buildah Logout
        if: ${{ always() }}
        run: sudo buildah logout ${{ env.REGISTRY_ADDRESS }}

  build-and-push-rhel9:
    name: Build and Push RHEL 9
    runs-on: arc-runner-set-rhel9
    if: ${{ github.event_name == 'push' || inputs.runner_rhel9 == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Login to container registry
        run: |
          echo "${{ env.REGISTRY_PASSWORD }}" | sudo buildah login ${{ env.REGISTRY_ADDRESS }} --username "${{ env.REGISTRY_NAMESPACE }}" --password-stdin

      - name: Build the container image
        run: |
          cd images && \
          make buildah-build-rhel \
            PIP_INDEX=${{ env.PIP_INDEX }} \
            OS_IMAGE=rhel-9 \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images

      - name: Push the container image
        run: |
          cd images && \
          make buildah-push \
            OS_IMAGE=rhel-9 \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images

      - name: Buildah Logout
        if: ${{ always() }}
        run: sudo buildah logout ${{ env.REGISTRY_ADDRESS }}
