name: Runner Updates Check (Scheduled Job)

permissions:
  pull-requests: write
  contents: write

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  check-and-update-versions:
    runs-on: arc-runner-set-u22
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check and apply version updates
        id: versions
        run: |
          # 1. Docker
          DOCKER_CURRENT=$(grep -oP '(?<=DOCKER_VERSION=).*' images/Makefile || echo "0.0.0")
          DOCKER_LATEST=$(curl -s https://download.docker.com/linux/static/stable/x86_64/ | grep -oP 'docker-\K[0-9]+\.[0-9]+\.[0-9]+(?=\.tgz)' | sort -V | tail -n 1)

          # 2. Docker Compose (Pinned to v2.x.x)
          COMPOSE_CURRENT=$(grep -oP '(?<=DOCKER_COMPOSE_VERSION=).*' images/Makefile || echo "0.0.0")
          COMPOSE_LATEST=$(gh release list -R docker/compose --exclude-drafts --exclude-pre-releases --limit 30 | grep -oP '(?<=v)2\.[0-9]+\.[0-9]+' | head -1)

          # 3. Actions Runner
          RUNNER_CURRENT=$(grep -oP '(?<=RUNNER_VERSION=).*' images/Makefile || echo "0.0.0")
          RUNNER_LATEST=$(gh release list -R actions/runner --exclude-drafts --exclude-pre-releases --limit 10 | grep -oP '(?<=v)[0-9.]+' | head -1)

          # 4. Container Hooks
          HOOKS_CURRENT=$(grep -oP '(?<=RUNNER_CONTAINER_HOOKS_VERSION=).*' images/Makefile || echo "0.0.0")
          HOOKS_LATEST=$(gh release list -R actions/runner-container-hooks --exclude-drafts --exclude-pre-releases --limit 10 | grep -oP '(?<=v)[0-9.]+' | head -1)

          # Determine if any updates are needed and build commit message
          SHOULD_UPDATE=0
          COMMIT_MSG="Update"

          if [ "$DOCKER_CURRENT" != "$DOCKER_LATEST" ] && [ -n "$DOCKER_LATEST" ] && [ "$DOCKER_CURRENT" != "0.0.0" ]; then
            SHOULD_UPDATE=1
            COMMIT_MSG="$COMMIT_MSG Docker to v$DOCKER_LATEST,"
            sed -i "s/DOCKER_VERSION=$DOCKER_CURRENT/DOCKER_VERSION=$DOCKER_LATEST/g" images/Makefile
          fi

          if [ "$COMPOSE_CURRENT" != "$COMPOSE_LATEST" ] && [ -n "$COMPOSE_LATEST" ] && [ "$COMPOSE_CURRENT" != "0.0.0" ]; then
            SHOULD_UPDATE=1
            COMMIT_MSG="$COMMIT_MSG Docker Compose to v$COMPOSE_LATEST,"
            sed -i "s/DOCKER_COMPOSE_VERSION=$COMPOSE_CURRENT/DOCKER_COMPOSE_VERSION=$COMPOSE_LATEST/g" images/Makefile
          fi

          if [ "$RUNNER_CURRENT" != "$RUNNER_LATEST" ] && [ -n "$RUNNER_LATEST" ] && [ "$RUNNER_CURRENT" != "0.0.0" ]; then
            SHOULD_UPDATE=1
            COMMIT_MSG="$COMMIT_MSG Runner to v$RUNNER_LATEST,"
            sed -i "s/RUNNER_VERSION=$RUNNER_CURRENT/RUNNER_VERSION=$RUNNER_LATEST/g" images/Makefile
          fi

          if [ "$HOOKS_CURRENT" != "$HOOKS_LATEST" ] && [ -n "$HOOKS_LATEST" ] && [ "$HOOKS_CURRENT" != "0.0.0" ]; then
            SHOULD_UPDATE=1
            COMMIT_MSG="$COMMIT_MSG Container Hooks to v$HOOKS_LATEST,"
            sed -i "s/RUNNER_CONTAINER_HOOKS_VERSION=$HOOKS_CURRENT/RUNNER_CONTAINER_HOOKS_VERSION=$HOOKS_LATEST/g" images/Makefile
          fi

          # Clean up trailing comma from the commit message
          COMMIT_MSG=$(echo "$COMMIT_MSG" | sed 's/,$//')

          # Generate branch name with the current date
          BRANCH_NAME="update-runner-deps-$(date +%Y-%m-%d)"

          # Output to GitHub Actions environment
          echo "should_update=$SHOULD_UPDATE" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Commit updated versions to new branch
        id: auto-commit
        if: steps.versions.outputs.should_update == '1'
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403
        with:
          commit_message: Bump runner dependency version
          file_pattern: "images/Makefile"
          branch: ${{ steps.versions.outputs.branch_name }}
          create_branch: true

      - name: Create Pull Request
        if: steps.versions.outputs.should_update == '1'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: Bump runner dependency version
          title: "Automated dependencies update generated by GitHub Actions."
          body: ${{ steps.versions.outputs.commit_msg }}
          branch: ${{ steps.versions.outputs.branch_name }}
          base: main
