# Monthly Duration Sync Workflow

# Requirements:
# - Repository has 'contents: write' and 'pull-requests: write' permissions
# - Workflow is configured to run on a schedule (1st of every month at 8:00 UTC)
# - Workflow can be manually triggered via the 'Reason for manual trigger' input

name: Monthly Duration Sync

on:
  schedule:
    # Run at 8:00 AM UTC on the 1st of every month
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        type: string
        default: "Manual duration sync"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-duration-sync
  cancel-in-progress: false

jobs:
  regenerate-durations:
    runs-on: arc-runner-set-u22

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Generate timestamp for artifacts
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Install ION and regenerate all .DURATION files
        timeout-minutes: 300
        run: |
          {
            echo "Starting ION installation and bulk duration regeneration at $(date)"
            export USER=$(whoami)
            echo "USER is set to: $USER"
            export ION_RUN_EXPERT="yes"
            export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
            autoreconf -fi
            ./configure --enable-crypto-mbedtls --enable-bpsec-debugging
            make all buildcheck
            sudo make install
            sudo ldconfig
            echo "Running bulk duration regeneration..."
            test -x ./tests/benchmark.py || { echo "::error::benchmark.py not found or not executable"; exit 1; }
            ./tests/benchmark.py -f --bulk
          } > duration-sync.log 2> >(tee -a duration-sync.log >&2)

          TEST_STATUS=$?
          wait  # Wait for background processes to complete

          if [ $TEST_STATUS -ne 0 ]; then
            echo "Bulk duration regeneration failed with status $TEST_STATUS" >&2
            echo "::error::Bulk duration regeneration failed. Please investigate."
            exit $TEST_STATUS
          fi

      - name: Upload full sync log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: duration-sync-log-${{ steps.timestamp.outputs.TIMESTAMP }}
          path: duration-sync.log

      - name: Upload benchmark stdout logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-logs-${{ steps.timestamp.outputs.TIMESTAMP }}
          path: |
            tests/**/*.stdout
            demos/**/*.stdout

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet tests/ demos/; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No .DURATION files were modified"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in .DURATION files"
            git diff --stat tests/ demos/
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: integration
          commit-message: "chore: monthly .DURATION file sync - ${{ steps.timestamp.outputs.TIMESTAMP }}"
          branch: monthly-duration-sync-${{ steps.timestamp.outputs.TIMESTAMP }}
          delete-branch: true
          title: "Monthly .DURATION File Sync - ${{ steps.timestamp.outputs.TIMESTAMP }}"
          body: |
            ## Monthly .DURATION File Synchronization

            This PR contains the monthly regeneration of all `.DURATION` files for ION tests and demos.

            **Triggered:** ${{ github.event_name == 'schedule' && 'Automated monthly cron' || format('Manual trigger: {0}', inputs.reason) }}
            **Timestamp:** ${{ steps.timestamp.outputs.TIMESTAMP }}
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### What Changed
            All `.DURATION` files in `tests/` and `demos/` have been regenerated by running:
            ```bash
            ./tests/benchmark.py -f --bulk
            ```

            ### Review Checklist
            - [ ] Verify no unexpected test failures in the workflow logs
            - [ ] Check that duration values are reasonable (no extreme outliers)
            - [ ] Confirm all expected tests have `.DURATION` files
            - [ ] Review artifacts for any test failures or warnings

            ### Artifacts
            - Build and sync logs: `duration-sync-log-${{ steps.timestamp.outputs.TIMESTAMP }}`
            - Individual test logs: `benchmark-logs-${{ steps.timestamp.outputs.TIMESTAMP }}`

            ---
            🤖 This PR was automatically generated by the monthly duration sync workflow.
          labels: |
            automation
            maintenance
          assignees: ${{ github.repository_owner }}

      - name: Summary
        if: ${{ always() }}
        run: |
          echo "## 📊 Monthly Duration Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** ${{ steps.timestamp.outputs.TIMESTAMP }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name == 'schedule' && '⏰ Automated monthly cron' || format('👤 Manual trigger: {0}', inputs.reason) }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.changes.outputs.changes }}" == "true" ]; then
            echo "✅ **Status:** PR created with updated .DURATION files" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Status:** No changes detected, PR not created" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Files" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.changes }}" == "true" ]; then
            git diff --stat tests/ demos/ >> $GITHUB_STEP_SUMMARY || echo "*Error generating diff*" >> $GITHUB_STEP_SUMMARY
          else
            echo "*No files changed*" >> $GITHUB_STEP_SUMMARY
          fi
