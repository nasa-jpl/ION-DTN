name: Regression Tests for ION using GitHub ARC

permissions:
  contents: read
  statuses: write
  pull-requests: read

on:
  workflow_call:
    inputs:
      tests_to_run:
        description: 'Space-separated list of tests to run (e.g., "test1 test2"). Leave blank to run all.'
        required: false
        type: string
        default: ""
      env_vars:
        description: 'Space-separated list of environment variables (e.g., "KEY1=VALUE1 KEY2=VALUE2").'
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Timeout for build and tests in minutes (default: 90 minutes / 1.5 hours)"
        required: false
        type: number
        default: 90
      num_runners:
        description: "Number of runners to use within a runner set (default: 7)"
        required: false
        type: number
        default: 7
      # Replaced the single string input with boolean toggles
      runner_u20:
        description: "Enable Ubuntu 20.04 (arc-runner-set-u20)"
        required: false
        type: boolean
        default: true
      runner_u22:
        description: "Enable Ubuntu 22.04 (arc-runner-set-u22)"
        required: false
        type: boolean
        default: true
      runner_ol8:
        description: "Enable Oracle Linux 8 (arc-runner-set-ol8)"
        required: false
        type: boolean
        default: true
      runner_ol9:
        description: "Enable Oracle Linux 9 (arc-runner-set-ol9)"
        required: false
        type: boolean
        default: true
      runner_rhel8:
        description: "Enable RHEL 8 (arc-runner-set-rhel8)"
        required: false
        type: boolean
        default: true
      runner_rhel9:
        description: "Enable RHEL 9 (arc-runner-set-rhel9)"
        required: false
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      tests_to_run:
        description: 'Space-separated list of tests to run (e.g., "test1 test2"). Leave blank to run all.'
        required: false
        type: string
        default: ""
      env_vars:
        description: 'Space-separated list of environment variables (e.g., "KEY1=VALUE1 KEY2=VALUE2").'
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Timeout for build and tests in minutes (default: 90 minutes / 1.5 hours)"
        required: false
        type: number
        default: 90
      num_runners:
        description: "Number of runners to use within a runner set (default: 7)"
        required: false
        type: number
        default: 7
      runner_u20:
        description: "Enable Ubuntu 20.04 (arc-runner-set-u20)"
        required: false
        type: boolean
        default: true
      runner_u22:
        description: "Enable Ubuntu 22.04 (arc-runner-set-u22)"
        required: false
        type: boolean
        default: true
      runner_ol8:
        description: "Enable Oracle Linux 8 (arc-runner-set-ol8)"
        required: false
        type: boolean
        default: true
      runner_ol9:
        description: "Enable Oracle Linux 9 (arc-runner-set-ol9)"
        required: false
        type: boolean
        default: true
      runner_rhel8:
        description: "Enable RHEL 8 (arc-runner-set-rhel8)"
        required: false
        type: boolean
        default: true
      runner_rhel9:
        description: "Enable RHEL 9 (arc-runner-set-rhel9)"
        required: false
        type: boolean
        default: true

jobs:
  setup:
    runs-on: arc-runner-set-u22
    outputs:
      testmatrix: ${{ steps.dataStep.outputs.testoutput }}
      pr_number: ${{ steps.get-pr.outputs.pr_number }}
      active_runners: ${{ steps.build-runners.outputs.runners }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Runner Matrix
        id: build-runners
        run: |
          RUNNERS="[]"
          if [ "${{ inputs.runner_u20 }}" == "true" ]; then RUNNERS=$(echo "$RUNNERS" | jq '. += ["arc-runner-set-u20"]'); fi
          if [ "${{ inputs.runner_u22 }}" == "true" ]; then RUNNERS=$(echo "$RUNNERS" | jq '. += ["arc-runner-set-u22"]'); fi
          if [ "${{ inputs.runner_ol8 }}" == "true" ]; then RUNNERS=$(echo "$RUNNERS" | jq '. += ["arc-runner-set-ol8"]'); fi
          if [ "${{ inputs.runner_ol9 }}" == "true" ]; then RUNNERS=$(echo "$RUNNERS" | jq '. += ["arc-runner-set-ol9"]'); fi
          if [ "${{ inputs.runner_rhel8 }}" == "true" ]; then RUNNERS=$(echo "$RUNNERS" | jq '. += ["arc-runner-set-rhel8"]'); fi
          if [ "${{ inputs.runner_rhel9 }}" == "true" ]; then RUNNERS=$(echo "$RUNNERS" | jq '. += ["arc-runner-set-rhel9"]'); fi

          if [ "$RUNNERS" == "[]" ]; then
            echo "Error: No runners selected. Please enable at least one runner."
            exit 1
          fi

          echo "runners=$(echo "$RUNNERS" | jq -c .)" >> $GITHUB_OUTPUT

      - name: Get test batches
        id: dataStep
        run: |
          if [ -n "${{ inputs.tests_to_run }}" ]; then
            TESTSET=$(./tests/git_matrix.py  -r ${{ inputs.num_runners }} -t ${{ inputs.tests_to_run }})
          else
            TESTSET=$(./tests/git_matrix.py -r ${{ inputs.num_runners }})
          fi

          # Transform the array into objects with a 1-based batch index
          TESTSET_WITH_BATCH=$(echo "$TESTSET" | jq -c '[to_entries | .[] | {batch: (.key + 1), tests: .value}]')

          echo "testoutput=$TESTSET_WITH_BATCH" >> $GITHUB_OUTPUT

      - name: Get PR number
        id: get-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Auto-detect PR number from branch name
          BRANCH="${{ github.ref_name }}"
          OWNER="${{ github.repository_owner }}"
          echo "Auto-detecting PR number for branch: $BRANCH"

          # Query the GitHub REST API directly using curl and jq
          PR_NUM=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pulls?head=${OWNER}:${BRANCH}&state=open" \
            | jq -r '.[0].number // empty')

          if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ]; then
            echo "Found open PR #$PR_NUM for branch $BRANCH"
          else
            echo "No open PR found for branch $BRANCH"
            PR_NUM=""
          fi
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.setup.outputs.active_runners) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Build Workspace
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            .
            !.git
            !autom4te.cache/
            !.github/
            !compile-and-buildcheck.log
            !**/*.md
          key: ion-build-${{ matrix.runner }}-${{ github.sha }}

      - name: Build ION and Run Buildcheck
        if: steps.cache-build.outputs.cache-hit != 'true'
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '90') }}
        run: |
          {
            export USER=$(whoami)
            echo "USER is set to: $USER"
            export ION_RUN_EXPERT="yes"
            export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
            autoreconf -fi
            ./configure --enable-crypto-mbedtls --enable-bpsec-debugging CFLAGS="-DHAVE_VALGRIND_VALGRIND_H"
            make all buildcheck
          } > compile-and-buildcheck.log 2> >(tee -a compile-and-buildcheck.log >&2)

          BUILD_STATUS=$?
          wait

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Build or buildcheck failed with status $BUILD_STATUS" >&2
            exit $BUILD_STATUS
          fi

      - name: Upload build and buildcheck logs
        if: ${{ always() && steps.cache-build.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: compile-and-buildcheck-log-${{ matrix.runner }}-${{ github.sha }}
          path: compile-and-buildcheck.log
          if-no-files-found: warn

  install-and-test:
    needs: [setup, build]
    name: "Test: ${{ matrix.runner }} (Batch ${{ matrix.testchunk.batch }})"
    strategy:
      fail-fast: false
      matrix:
        testchunk: ${{ fromJSON(needs.setup.outputs.testmatrix) }}
        runner: ${{ fromJSON(needs.setup.outputs.active_runners) }}

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Cached Build
        uses: actions/cache@v4
        with:
          path: |
            .
            !.git
            !autom4te.cache/
            !.github/
            !compile-and-buildcheck.log
            !**/*.md
          key: ion-build-${{ matrix.runner }}-${{ github.sha }}

      - name: Display OS and Arch
        run: |
          cat /etc/os-release
          echo "Arch:"
          uname -m
          echo "User ID:"
          id

      - name: Generate timestamp for file names
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: List tests and batch number
        run: |
          echo "Tests:"
          echo "${{ matrix.testchunk.tests }}"
          echo "Batch Number:"
          echo "${{ matrix.testchunk.batch }}"

      - name: Install ION and run tests
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '90') }}
        run: |
          {
            echo "Starting test installation and execution at $(date)"
            export USER=$(whoami)
            echo "USER is set to: $USER"
            export ION_RUN_EXPERT="yes"
            export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
            sudo make install
            sudo ldconfig
            cd tests
            if [ -n "${{ inputs.env_vars }}" ]; then
              echo "Setting environment variables: ${{ inputs.env_vars }}"
              for env_var in ${{ inputs.env_vars }}; do
                export "$env_var"
              done
            fi
            ./runtests ${{ matrix.testchunk.tests }}
          } > build-and-test.log 2> >(tee -a build-and-test.log >&2)

          TEST_STATUS=$?
          wait

          if [ $TEST_STATUS -ne 0 ]; then
            echo "Tests failed with status $TEST_STATUS" >&2
            exit $TEST_STATUS
          fi

      - name: Display Progress
        if: ${{ always() }}
        run: |
          cat ./tests/progress | grep "FAILED" || { printf "No failed tests.\n"; exit 0; }

      - name: Upload full test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-log-${{ matrix.runner }}-${{ env.TIMESTAMP }}-batch-${{ matrix.testchunk.batch }}
          path: build-and-test.log

      - name: Show progress file
        if: ${{ always() }}
        run: |
          echo "Contents of ./tests/progress:"
          cat ./tests/progress || echo "No progress file found."

      - name: Upload progress file
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-progress-${{ matrix.runner }}-${{ env.TIMESTAMP }}-batch-${{ matrix.testchunk.batch }}
          path: ./tests/progress

      - name: Collect and upload ion.log files from all test directories
        if: ${{ always() }}
        run: |
          echo "Collecting ion.log files with unique names..."
          mkdir -p ion-logs-collection
          find ./tests -name "ion.log" -type f | while IFS= read -r logfile; do
            relpath=$(echo "$logfile" | sed 's|^\./tests/||' | sed 's|/ion\.log$||')
            unique_name=$(echo "$relpath" | tr '/' '-')
            cp "$logfile" "ion-logs-collection/${unique_name}-ion.log"
            echo "Collected: $logfile -> ion-logs-collection/${unique_name}-ion.log"
          done

          # List all collected logs for verification
          echo "Collected ion.log files:"
          find ion-logs-collection -name "*.log" -type f | sort

      - name: Upload ion.log files as artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ion-logs-${{ matrix.runner }}-${{ env.TIMESTAMP }}-batch-${{ matrix.testchunk.batch }}
          path: ion-logs-collection/
          if-no-files-found: warn

      - name: Save Job Status for Final Summary
        if: ${{ always() }}
        run: |
          mkdir -p job-reports
          RESULT_ICON="${{ job.status == 'success' && '✅' || '❌' }}"

          # Extract Failed Tests: Start reading after 'failed:', stop at a blank line
          FAILED_TESTS=$(awk '/^failed: /{flag=1; next} /^$/{flag=0} flag {print $1}' ./tests/progress | tr -d '\r' | xargs | sed 's/ /, /g')
          [ -z "$FAILED_TESTS" ] && FAILED_TESTS="-"

          # Extract Skipped Tests: Start reading after 'skipped:', stop at a blank line
          SKIPPED_TESTS=$(awk '/^skipped: /{flag=1; next} /^$/{flag=0} flag {print $1}' ./tests/progress | tr -d '\r' | xargs | sed 's/ /, /g')
          [ -z "$SKIPPED_TESTS" ] && SKIPPED_TESTS="-"

          # Write the row with the new columns included
          echo "| ${{ matrix.runner }} | ${{ matrix.testchunk.batch }} | $RESULT_ICON ${{ job.status }} | $FAILED_TESTS | $SKIPPED_TESTS |" > job-reports/${{ matrix.runner }}-${{ matrix.testchunk.batch }}.txt

      - name: Upload Status Fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.runner }}-${{ matrix.testchunk.batch }}
          path: job-reports/
          if-no-files-found: warn

  aggregate-results:
    name: "Finalize Logs and Reports"
    needs: [setup, install-and-test]
    runs-on: arc-runner-set-ol8
    if: ${{ always() }}
    steps:
      - name: Generate timestamp for final bundle
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Download ALL artifacts
        uses: actions/download-artifact@v4
        with:
          # Downloads absolutely everything into one master folder
          path: all-artifacts
          merge-multiple: false

      - name: Generate Final Summary Table
        run: |
          echo "## 📊 Regression Test Overview" >> $GITHUB_STEP_SUMMARY
          echo "| Runner OS | Batch | Result | Failed Tests | Skipped Tests |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|--------|--------------|---------------|" >> $GITHUB_STEP_SUMMARY
          cat all-artifacts/status-*/*.txt | sort >> $GITHUB_STEP_SUMMARY

      - name: Calculate PR Statuses per Runner
        if: ${{ needs.setup.outputs.pr_number != '' }}
        id: pr-status
        run: |
          # Extract unique runner names from the status files
          RUNNERS=$(cat all-artifacts/status-*/*.txt | awk -F'|' '{print $2}' | tr -d ' ' | sort | uniq)

          JSON_PAYLOAD="{"
          FIRST=true
          for RUNNER in $RUNNERS; do
            # If any batch for this runner has the failure/cancelled icon ❌, mark the whole runner as failure
            if cat all-artifacts/status-${RUNNER}-*/*.txt | grep -q "❌"; then
              STATUS="failure"
            else
              STATUS="success"
            fi

            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              JSON_PAYLOAD="$JSON_PAYLOAD,"
            fi
            JSON_PAYLOAD="$JSON_PAYLOAD \"$RUNNER\": \"$STATUS\""
          done
          JSON_PAYLOAD="$JSON_PAYLOAD }"

          echo "payload=$JSON_PAYLOAD" >> $GITHUB_OUTPUT

      - name: Set PR status per runner
        if: ${{ needs.setup.outputs.pr_number != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const statuses = ${{ steps.pr-status.outputs.payload }};
            const prNumber = parseInt("${{ needs.setup.outputs.pr_number }}", 10);

            let pr;
            try {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              pr = data;
            } catch (error) {
              console.log(`PR #${prNumber} not found: ${error.message}`);
              return;
            }

            // Loop through the aggregated statuses and create one status check per runner
            for (const [runner, state] of Object.entries(statuses)) {
              console.log(`Setting PR status for ${runner} to ${state}`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: state,
                context: `ci/${runner}`,
                description: `Tests ${state === "success" ? "passed" : "failed"}`,
                target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              });
            }

      - name: Remove status fragments from the bundle folder
        run: |
          echo "Removing status data before zipping..."
          rm -rf all-artifacts/status-*

      - name: Upload Unified Bundle
        uses: actions/upload-artifact@v4
        with:
          name: final-regression-bundle-${{ env.TIMESTAMP }}
          path: all-artifacts/

      - name: Clean up ALL intermediate artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118
        with:
          name: |
            status-*
            compile-and-buildcheck-log-*
            build-and-test-log-*
            test-progress-*
            ion-logs-*
