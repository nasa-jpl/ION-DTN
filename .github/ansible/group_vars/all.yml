---
# Common variables for Solaris zone management

# Template zone configuration
template_zone_name: "template-ion"

# Zone naming pattern: ci-zone-{run_id}-{job_index}
zone_name_prefix: "ci-zone"

# ZFS configuration
zfs_root_pool: "rpool/zones"
zone_mountpoint_base: "/zones"

# Timeouts and retries
zone_clone_timeout: 180 # 3 minutes for zone cloning
zone_boot_timeout: 900 # 15 minutes for zone boot
zone_create_retries: 2
zone_create_retry_delay: 3

# Paths on target VMs
zone_staging_dir: "/tmp/zone-artifacts"
