name: Run All PR Tests

permissions:
  contents: read
  statuses: write
  pull-requests: write

on:
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        labeled,
        unlabeled,
        converted_to_draft,
        ready_for_review,
      ]
    branches: ["integration"]
  workflow_dispatch:
    inputs:
      tests_to_run:
        description: "Space-separated subset of tests for a quick run (leave blank for all)"
        required: false
        type: string
        default: ""
      env_vars:
        description: 'Space-separated list of environment variables (e.g., "KEY1=VALUE1 KEY2=VALUE2").'
        required: false
        type: string
        default: ""

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      needs-tests: ${{ steps.final-needs-tests.outputs.needs_tests }}
      tests-subset: ${{ steps.determine-tests.outputs.tests_to_run }}
      pr-number: ${{ github.event.pull_request.number }}
      enable_retest_value: ${{ steps.determine-tests.outputs.enable_retest_value }}
    steps:
      - uses: actions/checkout@v6

      - name: Auto-assign PR labels
        uses: actions/labeler@v7
        id: pr-labels
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            relevant_changes:
              - '**/*.c'
              - '**/*.h'
              - 'configure.ac'
              - 'Makefile.am'
              - 'build-bsl-for-ion.sh'
              - '.github/**'
              - 'tests/**'
              - 'demos/**'
              - 'killm'

      - name: Set final needs-tests
        id: final-needs-tests
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NEEDS_TESTS="${{ steps.filter.outputs.relevant_changes }}"

          # Force tests to skip if the PR is currently marked as a draft
          if [ "$IS_DRAFT" == "true" ]; then
            echo "Draft status detected. Forcing tests to skip."
            NEEDS_TESTS="false"
          fi

          # Fetch live labels and evaluate for 'no-test'
          if [ -n "$PR_NUMBER" ]; then
            LIVE_LABELS=${{ steps.pr-labels.outputs.all-labels }}
            echo "LIVE_LABELS=$LIVE_LABELS" >> $GITHUB_ENV

            if [[ " $LIVE_LABELS " == *" no-test "* ]]; then
              echo "'no-test' label detected. Forcing tests to skip."
              NEEDS_TESTS="false"
            fi
          fi

          echo "needs_tests=$NEEDS_TESTS" >> $GITHUB_OUTPUT

      - name: Determine Test Subset
        id: determine-tests
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS_TO_RUN: ${{ inputs.tests_to_run }}
        run: |
          TESTS=""
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PADDED_LABELS=" ${LIVE_LABELS//,/ } "

          [[ "$PADDED_LABELS" == *" retest "* ]] && ENABLE_RETEST_VALUE="ENABLE_RETEST=1" || ENABLE_RETEST_VALUE="ENABLE_RETEST=0"
          echo "Constructed ENABLE_RETEST: $ENABLE_RETEST_VALUE"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TESTS="${{ env.TESTS_TO_RUN }}"
            echo "Manual trigger. Tests: $TESTS"

          elif [[ "$PADDED_LABELS" == *" test-mods "* ]]; then
            echo "'test-mods' label detected. Analyzing changed files..."

            # Fetch, extract parent directories, deduplicate, and join into a space-separated string in one line
            CHANGED_FILES=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/files --paginate --jq '.[].filename')
            TESTS=$(echo "$CHANGED_FILES" | awk -F'/' '/^(tests|demos)\// {print $2}' | sort -u | xargs)

            [ -z "$TESTS" ] && echo "Warning: No valid test/demo files changed." || echo "Dynamically detected tests: $TESTS"

          elif [[ "$PADDED_LABELS" == *" quick-test "* || "$PADDED_LABELS" == *" CI/CD "* ]]; then
            TESTS="bping cfdpv1 ams-sana ltp-cancel-ack-regression tcpcl-dos bibect conformance_test"
            echo "Quick-test/CI label detected. Tests: $TESTS"

          else
            echo "Standard PR push. Running ALL tests."
          fi

          echo "tests_to_run=$TESTS" >> $GITHUB_OUTPUT
          echo "enable_retest_value=$ENABLE_RETEST_VALUE" >> $GITHUB_OUTPUT

  run-solaris-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.needs-tests == 'true' }}
    uses: ./.github/workflows/ci-workflow-solaris.yml
    with:
      tests_to_run: ${{ needs.detect-changes.outputs.tests-subset }}
      env_vars: ${{ needs.detect-changes.outputs.enable_retest_value }} ${{ inputs.env_vars }}
      pr_number: ${{ needs.detect-changes.outputs.pr-number }}
    secrets: inherit

  run-arc-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.needs-tests == 'true' }}
    uses: ./.github/workflows/ci-workflow-arc.yml
    with:
      tests_to_run: ${{ needs.detect-changes.outputs.tests-subset }}
      env_vars: ${{ needs.detect-changes.outputs.enable_retest_value }} ${{ inputs.env_vars }}
      pr_number: ${{ needs.detect-changes.outputs.pr-number }}
      runner_u22: true
      runner_u24: true
      runner_ol8: true
      runner_ol9: true
      runner_rhel8: true
      runner_rhel9: true

  # Skip tests and satisfy the Rulesets
  skip-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.needs-tests == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Bypassed Statuses to GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const requiredContexts = [
              'ci/solaris',
              'ci/arc-runner-set-u22',
              'ci/arc-runner-set-u24',
              'ci/arc-runner-set-ol8',
              'ci/arc-runner-set-ol9',
              'ci/arc-runner-set-rhel8',
              'ci/arc-runner-set-rhel9'
            ];

            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : null;

            // If triggered manually without a PR, we don't need to post statuses
            if (!prNumber) {
               console.log("No PR detected. Skipping status updates.");
               return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            for (const statusContext of requiredContexts) {
              console.log(`Bypassing tests: Setting ${statusContext} to success`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: 'success',
                context: statusContext,
                description: 'Tests bypassed (Draft PR or no relevant files changed)'
              });
            }
