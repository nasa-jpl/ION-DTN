name: Run All PR Tests Manually

permissions:
  contents: read
  statuses: write
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      tests_to_run:
        description: 'Space-separated list of tests to run (e.g., "test1 test2"). Leave blank to run all.'
        required: false
        type: string
        default: ""
      pr_number:
        description: "Pull request number (leave blank to auto-detect from branch)"
        required: false
        type: string
        default: ""
      env_vars:
        description: 'Space-separated list of environment variables (e.g., "KEY1=VALUE1 KEY2=VALUE2").'
        required: false
        type: string
        default: ""

jobs:
  # Resolve PR number specifically for Ubuntu since it lacks internal auto-detect
  get-pr-number:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.get-pr.outputs.pr_number }}
    steps:
      - name: Resolve PR Number
        id: get-pr
        uses: actions/github-script@v9
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_PR: ${{ inputs.pr_number }}
        with:
          script: |
            let prNumber = process.env.INPUT_PR;

            if (!prNumber) {
              console.log(`No PR number provided. Auto-detecting open PR for branch ${process.env.REF_NAME}...`);
              try {
                const { data } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head: `${context.repo.owner}:${process.env.REF_NAME}`,
                  state: 'open'
                });

                if (data && data.length > 0) {
                  prNumber = data[0].number.toString();
                  console.log(`Auto-detected PR #${prNumber}`);
                } else {
                  console.log(`No open PR found for branch ${process.env.REF_NAME}.`);
                  prNumber = '';
                }
              } catch (error) {
                console.log(`Error detecting PR: ${error.message}`);
                prNumber = '';
              }
            } else {
              console.log(`Using provided input PR number: ${prNumber}`);
            }

            core.setOutput('pr_number', prNumber || '');

  ubuntu-latest:
    needs: get-pr-number
    uses: ./.github/workflows/ci-workflow-ubuntu.yml
    with:
      pr_number: ${{ needs.get-pr-number.outputs.pr_number }}
      tests_to_run: ${{ inputs.tests_to_run || '' }}
      env_vars: ${{ inputs.env_vars || '' }}

  arc-tests:
    uses: ./.github/workflows/ci-workflow-arc.yml
    with:
      tests_to_run: ${{ inputs.tests_to_run || '' }}
      env_vars: ${{ inputs.env_vars || '' }}

  solaris:
    uses: ./.github/workflows/ci-workflow-solaris.yml
    with:
      tests_to_run: ${{ inputs.tests_to_run || '' }}
      env_vars: ${{ inputs.env_vars || '' }}
    secrets: inherit
