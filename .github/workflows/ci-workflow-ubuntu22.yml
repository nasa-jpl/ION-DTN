name: Regression Tests for ION on Ubuntu 22

on:
  workflow_dispatch:
  push:
    branches:
      - update-4.1.4-ci-workflow

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64]

    container:  
      image: ubuntu:jammy  # Run jobs on Ubuntu 22

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display OS and Arch
        run: |
          cat /etc/os-release
          echo "Arch:"
          uname -m
      
      - name: Set up dependencies
        run: |
            sudo apt-get update
            sudo apt-get install -y autoconf automake libtool bash python3 gcc make  # Install dependencies
  
      - name: Generate timestamp for file names
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Run build and tests, capture stdout
        run: | # For now run only test starting with "b", redirect stdout and stderr to a log
          {
            echo "Starting build and tests at $(date)"
            autoreconf -fi
            ./configure
            make
            sudo make install
            make test
            sudo ldconfig
            cd tests
            ./runtests bptrace_terminal_test  # Run the test
          } > build-and-test.log 2>&1

      - name: Display Progress
        if: ${{ always() }}  # Display progress even if tests were interrupted
        run: | 
          cat ./tests/progress

      - name: Upload full build and test log
        if: ${{ always() }}  # Capture log even if the previous step fails
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-log-${{ env.TIMESTAMP }}
          path: build-and-test.log  # Upload the entire stdout and stderr as an artifact

      - name: Upload progress file as artifact
        if: ${{ always() }}  # Capture progress even if the previous step fails
        uses: actions/upload-artifact@v4
        with:
          name: test-progress-${{ env.TIMESTAMP }}
          path: ./tests/progress  # Upload the 'progress' file for later review


