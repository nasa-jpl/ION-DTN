name: Regression Tests for ION using GitHub ARC

permissions:
  contents: read
  statuses: write
  pull-requests: read

on:
  workflow_call:
    inputs:
      tests_to_run:
        description:
          'Space-separated list of tests to run (e.g., "test1 test2").
          Leave blank to run all.'
        required: false
        type: string
        default: ""
      env_vars:
        description:
          'Space-separated list of environment variables (e.g., "KEY1=VALUE1
          KEY2=VALUE2").'
        required: false
        type: string
        default: ""
      # When true, the runtests script will automatically retry failed tests.
      # Note: Explicit ENABLE_RETEST in env_vars takes precedence over this input.
      enable_retest:
        description: "Enable automatic rerun of failed tests (ENABLE_RETEST). Default: false (no reruns)."
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description:
          "Timeout for build and tests in minutes (default: 90 minutes / 1.5
          hours)"
        required: false
        type: number
        default: 90
      num_runners:
        description: "Number of runners to use within a runner set (default: 7)"
        required: false
        type: number
        default: 7
      runner_u22:
        description: "Enable Ubuntu 22.04 (arc-runner-set-u22)"
        required: false
        type: boolean
        default: true
      runner_u24:
        description: "Enable Ubuntu 24.04 (arc-runner-set-u24)"
        required: false
        type: boolean
        default: false
      runner_ol8:
        description: "Enable Oracle Linux 8 (arc-runner-set-ol8)"
        required: false
        type: boolean
        default: false
      runner_ol9:
        description: "Enable Oracle Linux 9 (arc-runner-set-ol9)"
        required: false
        type: boolean
        default: false
      runner_rhel8:
        description: "Enable RHEL 8 (arc-runner-set-rhel8)"
        required: false
        type: boolean
        default: false
      runner_rhel9:
        description: "Enable RHEL 9 (arc-runner-set-rhel9)"
        required: false
        type: boolean
        default: false
      pr_number:
        description:
          "Optional PR number to use for status reporting. If left blank, the
          workflow will attempt to auto-detect it."
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      tests_to_run:
        description:
          'Space-separated list of tests to run (e.g., "test1 test2").
          Leave blank to run all.'
        required: false
        type: string
        default: ""
      env_vars:
        description:
          'Space-separated list of environment variables (e.g., "KEY1=VALUE1
          KEY2=VALUE2").'
        required: false
        type: string
        default: ""
      # When true, the runtests script will automatically retry failed tests.
      # Note: Explicit ENABLE_RETEST in env_vars takes precedence over this input.
      enable_retest:
        description: "Enable automatic rerun of failed tests (ENABLE_RETEST). Default: false (no reruns)."
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description:
          "Timeout for build and tests in minutes (default: 90 minutes / 1.5
          hours)"
        required: false
        type: number
        default: 90
      num_runners:
        description: "Number of runners to use within a runner set (default: 7)"
        required: false
        type: number
        default: 7
      runner_u22:
        description: "Enable Ubuntu 22.04 (arc-runner-set-u22)"
        required: false
        type: boolean
        default: false
      runner_u24:
        description: "Enable Ubuntu 24.04 (arc-runner-set-u24)"
        required: false
        type: boolean
        default: false
      runner_ol8:
        description: "Enable Oracle Linux 8 (arc-runner-set-ol8)"
        required: false
        type: boolean
        default: false
      runner_ol9:
        description: "Enable Oracle Linux 9 (arc-runner-set-ol9)"
        required: false
        type: boolean
        default: false
      runner_rhel8:
        description: "Enable RHEL 8 (arc-runner-set-rhel8)"
        required: false
        type: boolean
        default: false
      runner_rhel9:
        description: "Enable RHEL 9 (arc-runner-set-rhel9)"
        required: false
        type: boolean
        default: false
      pr_number:
        description:
          "Optional PR number to use for status reporting. If left blank, the
          workflow will attempt to auto-detect it."
        required: false
        type: string
        default: ""

jobs:
  setup:
    runs-on: arc-runner-set-u22
    outputs:
      testmatrix: ${{ steps.map-matrix.outputs.matrix }}
      count: ${{ steps.map-matrix.outputs.count }}
      pr_number: ${{ inputs.pr_number }}
      active_runners: ${{ steps.build-runners.outputs.runners }}
      timestamp: ${{ steps.generate-timestamp.outputs.timestamp }}
      src_hash: ${{ steps.calculate-hash.outputs.hash }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Calculate Source Hash
        id: calculate-hash
        run: echo "hash=${{ hashFiles('**/*.c', '**/*.h', 'configure.ac', 'Makefile.am', 'build-bsl-for-ion.sh') }}" >> $GITHUB_OUTPUT

      - name: Build Runner Matrix
        id: build-runners
        run: |
          RUNNERS=$(./.github/scripts/build-runner-matrix.sh \
          --ubuntu_22=${{ inputs.runner_u22 }} \
          --ubuntu_24=${{ inputs.runner_u24 }} \
            --oracle_linux_8=${{ inputs.runner_ol8 }} \
            --oracle_linux_9=${{ inputs.runner_ol9 }} \
            --rhel_8=${{ inputs.runner_rhel8 }} \
            --rhel_9=${{ inputs.runner_rhel9 }})

          # Map short names (u22, u24, etc.) to full runner names (arc-runner-set-u22, etc.)
          FULL_RUNNERS=$(echo "$RUNNERS" | jq -c 'map("arc-runner-set-" + .)')

          echo "runners=$FULL_RUNNERS" >> $GITHUB_OUTPUT

      - name: Get test batches
        id: map-matrix
        uses: ./.github/actions/generate-test-matrix
        with:
          tests_to_run: ${{ inputs.tests_to_run }}
          num_runners: ${{ inputs.num_runners }}
          is_solaris: "false"

      # Generate timestamp once in setup, share with all downstream jobs
      # Ensures consistent artifact naming across all runners and batches
      - name: Generate timestamp for artifacts
        id: generate-timestamp
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Generated timestamp: $TIMESTAMP"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.setup.outputs.active_runners) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Restore Build Workspace Cache
        id: cache-build-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            .
            !.git
            !autom4te.cache/
            !.github/
            !compile-and-buildcheck.log
            !**/*.md
          # Primary key is globally unique to prevent save collisions
          key: ion-build-${{ matrix.runner }}-${{ needs.setup.outputs.src_hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Fallback looks for any previous cache sharing this exact source code hash
          restore-keys: |
            ion-build-${{ matrix.runner }}-${{ needs.setup.outputs.src_hash }}-

      - name: Build ION and Run Buildcheck
        if: ${{ steps.cache-build-restore.outputs.cache-matched-key == '' }}
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '90') }}
        env:
          EXTRA_CONFIGURE_FLAGS: "CFLAGS=-DHAVE_VALGRIND_VALGRIND_H"
        run: |
          ./.github/scripts/compile-and-buildcheck.sh > compile-and-buildcheck.log 2>&1 || {
            BUILD_STATUS=$?
            echo "Build or buildcheck failed with status $BUILD_STATUS" >&2
            exit $BUILD_STATUS
          }

      - name: Upload build and buildcheck logs
        if: ${{ always() && steps.cache-build-restore.outputs.cache-matched-key == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: compile-and-buildcheck-log-arc-${{ matrix.runner }}-${{ needs.setup.outputs.timestamp }}
          path: compile-and-buildcheck.log
          if-no-files-found: warn

      - name: Save Build Workspace Cache
        if: ${{ success() && steps.cache-build-restore.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .
            !.git
            !autom4te.cache/
            !.github/
            !compile-and-buildcheck.log
            !**/*.md
          key: ion-build-${{ matrix.runner }}-${{ needs.setup.outputs.src_hash }}-${{ github.run_id }}-${{ github.run_attempt }}

  install-and-test:
    needs: [setup, build]
    name: "Test: ${{ matrix.runner }} (Batch ${{ matrix.test_batch.batch }})"
    # test_batch matrix variable contains: {batch: N, tests: "test1 test2"}
    strategy:
      fail-fast: false
      matrix:
        test_batch: ${{ fromJSON(needs.setup.outputs.testmatrix) }}
        runner: ${{ fromJSON(needs.setup.outputs.active_runners) }}

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Display OS and Arch
        run: |
          cat /etc/os-release
          echo "Arch:"
          uname -m
          echo "User ID:"
          id

      - name: List tests and batch number
        run: |
          echo "Tests:"
          echo "${{ matrix.test_batch.tests }}"
          echo "Batch Number:"
          echo "${{ matrix.test_batch.batch }}"

      - name: Restore Cached Build (Attempt 1)
        uses: actions/cache/restore@v5
        id: cache-restore-1
        with:
          path: |
            .
            !.git
            !autom4te.cache/
            !.github/
            !compile-and-buildcheck.log
            !**/*.md
          key: ion-build-${{ matrix.runner }}-${{ needs.setup.outputs.src_hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ion-build-${{ matrix.runner }}-${{ needs.setup.outputs.src_hash }}-

      - name: Restore Cached Build (Attempt 2 - Retry on failure)
        # Only run attempt 2 if attempt 1 completely failed to find a matching key
        if: ${{ steps.cache-restore-1.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@v5
        id: cache-restore-2
        with:
          path: |
            .
            !.git
            !autom4te.cache/
            !.github/
            !compile-and-buildcheck.log
            !**/*.md
          key: ion-build-${{ matrix.runner }}-${{ needs.setup.outputs.src_hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ion-build-${{ matrix.runner }}-${{ needs.setup.outputs.src_hash }}-

      # Re-checkout the correct ref with clean:false: this resets all tracked
      # files (tests/, demos/, killm, ...) to this job's ref regardless of the
      # state the restored build cache left the working tree in, while
      # preserving the untracked compiled test binaries that `make buildcheck`
      # produced in the cached tree.
      - name: Overlay fresh tests and scripts
        if: ${{ steps.cache-restore-1.outputs.cache-matched-key != '' || steps.cache-restore-2.outputs.cache-matched-key != '' }}
        uses: actions/checkout@v6
        with:
          clean: false

      - name: Install ION and run tests
        if: ${{ steps.cache-restore-1.outputs.cache-matched-key != '' || steps.cache-restore-2.outputs.cache-matched-key != '' }}
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '90') }}
        run: |
          {
            echo "Starting test installation and execution at $(date)"
            export USER=$(whoami)
            echo "USER is set to: $USER"
            export ION_RUN_EXPERT="yes"
            export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
            sudo make install
            sudo ldconfig
            cd tests
            # Construct ENABLE_RETEST based on enable_retest input (unless already in env_vars)
            CONSTRUCTED_ENV_VARS="${{ inputs.env_vars }}"
            if echo "$CONSTRUCTED_ENV_VARS" | grep -qE '(^|[[:space:]])ENABLE_RETEST='; then
              echo "ENABLE_RETEST already set in env_vars, honoring explicit value"
            else
              if [ "${{ inputs.enable_retest }}" = "true" ]; then
                CONSTRUCTED_ENV_VARS="ENABLE_RETEST=1 $CONSTRUCTED_ENV_VARS"
              else
                CONSTRUCTED_ENV_VARS="ENABLE_RETEST=0 $CONSTRUCTED_ENV_VARS"
              fi
            fi
            if [ -n "$CONSTRUCTED_ENV_VARS" ]; then
              echo "Setting environment variables: $CONSTRUCTED_ENV_VARS"
              for env_var in $CONSTRUCTED_ENV_VARS; do
                export "$env_var"
              done
            fi
            ./runtests ${{ matrix.test_batch.tests }}
          } > build-and-test.log 2> >(tee -a build-and-test.log >&2)

          TEST_STATUS=$?
          wait

          if [ $TEST_STATUS -ne 0 ]; then
            echo "Tests failed with status $TEST_STATUS" >&2
            exit $TEST_STATUS
          fi

      - name: Display Progress
        if: ${{ always() }}
        run: |
          cat ./tests/progress | grep "FAILED" || { printf "No failed tests.\n"; exit 0; }

      - name: Collect ion.log files from all test directories
        if: ${{ always() }}
        run: |
          echo "Collecting ion.log files with unique names..."
          mkdir -p ion-logs-collection
          # Search from repo root so demos/ and tutorials/ tests (run via
          # ../demos/foo from tests/) are included, not just tests/foo.
          find . -path ./.git -prune -o -path ./external -prune \
                 -o -path ./ion-logs-collection -prune \
                 -o -name "ion.log" -type f -print | while IFS= read -r logfile; do
            relpath="${logfile#./}"
            unique_name=$(echo "${relpath%/ion.log}" | tr '/' '-')
            cp "$logfile" "ion-logs-collection/${unique_name}-ion.log"
            echo "Collected: $logfile -> ion-logs-collection/${unique_name}-ion.log"
          done

          # List all collected logs for verification
          echo "Collected ion.log files:"
          find ion-logs-collection -name "*.log" -type f | sort

      - name: Collect ion-system.log diagnostic files
        if: ${{ always() }}
        run: |
          mkdir -p diagnostics-collection
          # Search from repo root so demos/ and tutorials/ tests (run via
          # ../demos/foo from tests/) are included, not just tests/foo.
          find . -path ./.git -prune -o -path ./external -prune \
                 -o -path ./diagnostics-collection -prune \
                 -o -name "ion-system.log" -type f -print | while IFS= read -r logfile; do
            relpath="${logfile#./}"
            unique_name=$(echo "${relpath%/ion-system.log}" | tr '/' '-')
            cp "$logfile" "diagnostics-collection/${unique_name}-ion-system.log"
          done

      - name: Save Job Status for Final Summary
        if: ${{ always() }}
        run: |
          mkdir -p job-reports
          RESULT_ICON="${{ job.status == 'success' && '✅' || '❌' }}"

          # Extract Failed Tests: Start reading after 'failed:', stop at a blank line
          FAILED_TESTS=$(awk '/^failed: /{flag=1; next} /^$/{flag=0} flag {print $1}' ./tests/progress | tr -d '\r' | xargs | sed 's/ /, /g')
          [ -z "$FAILED_TESTS" ] && FAILED_TESTS="-"

          # Extract Skipped Tests: Start reading after 'skipped:', stop at a blank line
          SKIPPED_TESTS=$(awk '/^skipped: /{flag=1; next} /^$/{flag=0} flag {print $1}' ./tests/progress | tr -d '\r' | xargs | sed 's/ /, /g')
          [ -z "$SKIPPED_TESTS" ] && SKIPPED_TESTS="-"

          # Write the row with the new columns included
          echo "| ${{ matrix.runner }} | ${{ matrix.test_batch.batch }} | $RESULT_ICON ${{ job.status }} | $FAILED_TESTS | $SKIPPED_TESTS |" > job-reports/${{ matrix.runner }}-${{ matrix.test_batch.batch }}.txt

      - name: Bundle test artifacts
        if: ${{ always() }}
        run: |
          ARTIFACT_NAME="test-results-${{ matrix.runner }}-${{ needs.setup.outputs.timestamp }}-batch-${{ matrix.test_batch.batch }}"

          mkdir -p "test-bundle/$ARTIFACT_NAME"

          cp build-and-test.log "test-bundle/$ARTIFACT_NAME/" 2>/dev/null || echo "No build-and-test.log"
          cp ./tests/progress "test-bundle/$ARTIFACT_NAME/" 2>/dev/null || echo "No progress file"

          if [ -d "ion-logs-collection" ]; then
            cp -r ion-logs-collection "test-bundle/$ARTIFACT_NAME/"
          fi

          if [ -d "diagnostics-collection" ]; then
            cp -r diagnostics-collection "test-bundle/$ARTIFACT_NAME/"
          fi

          if [ -d "job-reports" ]; then
            cp -r job-reports "test-bundle/$ARTIFACT_NAME/"
          fi

          echo "Test bundle contents:"
          find test-bundle -type f

      - name: Upload bundled test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.runner }}-${{ needs.setup.outputs.timestamp }}-batch-${{ matrix.test_batch.batch }}
          path: test-bundle/
          if-no-files-found: warn

  aggregate-results:
    name: "Finalize Logs and Reports"
    needs: [setup, install-and-test]
    runs-on: arc-runner-set-ol8
    if: ${{ always() }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download ALL ARC artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: "*arc-runner-set-*-${{ needs.setup.outputs.timestamp }}*"
          path: all-artifacts
          merge-multiple: true # Forces flat extraction so nested dirs become siblings

      - name: Check for downloaded test results
        id: check-results
        run: |
          # Check for loose progress files (indicates flat extraction of old un-nested format)
          if ls all-artifacts/progress >/dev/null 2>&1; then
             echo "::error::Loose files detected in all-artifacts/. Artifact nesting failed."
             exit 1
          fi

          if ls -d all-artifacts/test-results-*-batch-* >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No intermediate test-results artifacts found. Expected when only"
            echo "finalize (not setup/test) was re-run and cleanup already deleted"
            echo "them; falling back to the final bundle."
          fi

      - name: Fall back to final bundle on re-run
        # get previous successful progress files from the final bundle
        if: ${{ steps.check-results.outputs.found == 'false' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: final-arc-bundle-${{ needs.setup.outputs.timestamp }}
          path: all-artifacts

      - name: Generate test summary and PR status payload
        id: test-summary
        env:
          ACTIVE_RUNNERS: ${{ needs.setup.outputs.active_runners }}
          IS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          TOTAL_BATCHES: ${{ needs.setup.outputs.count }}
        run: |
          ./.github/scripts/generate-test-summary.sh \
            --platform arc \
            --artifact-pattern "all-artifacts/test-results-*-batch-*" \
            --active-runners "$ACTIVE_RUNNERS" \
            --is-cancelled "$IS_CANCELLED" \
            --total-batches "$TOTAL_BATCHES"

      - name: Set PR status per runner
        run: |
          # Transform status_payload array to simple context->state mapping for set-pr-status
          # default to {} so empty object is valid
          STATUS_SIMPLE=$(echo '${{ steps.test-summary.outputs.status_payload }}' | \
            jq -c '[.[] | {(.context): .state}] | add // {}')
          echo "status_payload=$STATUS_SIMPLE" >> $GITHUB_OUTPUT
        id: transform-status

      - name: Call set-pr-status action
        uses: ./.github/actions/set-pr-status
        with:
          pr_number: ${{ needs.setup.outputs.pr_number }}
          status_payload: ${{ steps.transform-status.outputs.status_payload }}

      - name: Remove job-reports from bundle
        run: |
          echo "Removing job-reports from bundle..."
          find all-artifacts -type d -name "job-reports" -exec rm -rf {} + 2>/dev/null || true

      - name: Upload Unified Bundle
        uses: actions/upload-artifact@v7
        with:
          name: final-arc-bundle-${{ needs.setup.outputs.timestamp }}
          path: all-artifacts/
          # overwrite to handle running just failed jobs
          overwrite: true

      - name: Clean up ALL intermediate artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118
        with:
          name: |
            test-results-arc-*
            compile-and-buildcheck-log-arc-*
          failOnError: false
