name: Run All PR Tests

permissions:
  contents: read
  statuses: write
  pull-requests: write

on:
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        labeled,
        unlabeled,
        converted_to_draft,
        ready_for_review,
      ]
    branches: ["integration"]
  workflow_dispatch:
    inputs:
      tests_to_run:
        description: "Space-separated subset of tests for a quick run (leave blank for all)"
        required: false
        type: string
        default: ""
      env_vars:
        description: 'Space-separated list of environment variables (e.g., "KEY1=VALUE1 KEY2=VALUE2").'
        required: false
        type: string
        default: ""

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: ${{ !(github.event.action == 'labeled' && github.event.pull_request.created_at == github.event.pull_request.updated_at) }}
    outputs:
      needs-tests: ${{ steps.final-needs-tests.outputs.needs_tests }}
      is-duplicate: ${{ steps.final-needs-tests.outputs.is_duplicate }}
      tests-subset: ${{ steps.determine-tests.outputs.tests_to_run }}
      pr-number: ${{ github.event.pull_request.number }}
      enable_retest_value: ${{ steps.determine-tests.outputs.enable_retest_value }}
    steps:
      - uses: actions/checkout@v6

      - name: Auto-assign PR labels
        uses: actions/labeler@v7
        id: pr-labels
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            relevant_changes:
              - '**/*.c'
              - '**/*.h'
              - 'configure.ac'
              - 'Makefile.am'
              - 'build-bsl-for-ion.sh'
              - '.github/**'
              - 'tests/**'
              - 'demos/**'
              - 'killm'

      - name: Set final needs-tests
        id: final-needs-tests
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Pass the labeler output as an environment value, never expanded
          # into the script text: a label name may contain spaces (or shell
          # metacharacters), and interpolating it inline would let bash parse
          # it as a command.
          PR_LABELS: ${{ steps.pr-labels.outputs.all-labels }}
        run: |
          NEEDS_TESTS="${{ steps.filter.outputs.relevant_changes }}"

          # Handle any timestamp discrepancy between PR creation and labeling
          # to prevent double runs
          if [ "${{ github.event.action }}" == "labeled" ]; then
            CREATED=$(date -d "${{ github.event.pull_request.created_at }}" +%s)
            UPDATED=$(date -d "${{ github.event.pull_request.updated_at }}" +%s)

            if [ $((UPDATED - CREATED)) -lt 5 ]; then
              echo "Label applied during PR creation. Suppressing duplicate run."
              echo "needs_tests=false" >> $GITHUB_OUTPUT
              echo "is_duplicate=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          if [ "$IS_DRAFT" == "true" ]; then
            echo "Draft status detected. Forcing tests to skip."
            NEEDS_TESTS="false"
          fi

          # Fetch live labels and evaluate for 'no-test'
          if [ -n "$PR_NUMBER" ]; then
            LIVE_LABELS="$PR_LABELS"
            echo "LIVE_LABELS=$LIVE_LABELS" >> $GITHUB_ENV

            if [[ " ${LIVE_LABELS//,/ } " == *" no-test "* ]]; then
              echo "'no-test' label detected. Forcing tests to skip."
              NEEDS_TESTS="false"
            fi
          fi

          echo "needs_tests=$NEEDS_TESTS" >> $GITHUB_OUTPUT
          echo "is_duplicate=false" >> $GITHUB_OUTPUT

      - name: Determine Test Subset
        id: determine-tests
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS_TO_RUN: ${{ inputs.tests_to_run }}
        run: |
          TESTS=""
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PADDED_LABELS=" ${LIVE_LABELS//,/ } "

          [[ "$PADDED_LABELS" == *" retest "* ]] && ENABLE_RETEST_VALUE="ENABLE_RETEST=1" || ENABLE_RETEST_VALUE="ENABLE_RETEST=0"
          echo "Constructed ENABLE_RETEST: $ENABLE_RETEST_VALUE"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TESTS="${{ env.TESTS_TO_RUN }}"
            echo "Manual trigger. Tests: $TESTS"

          elif [[ "$PADDED_LABELS" == *" test-mods "* ]]; then
            echo "'test-mods' label detected. Analyzing changed files..."

            # Fetch, extract parent directories, deduplicate, and join into a space-separated string in one line
            CHANGED_FILES=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/files --paginate --jq '.[].filename')
            TESTS=$(echo "$CHANGED_FILES" | awk -F'/' '/^(tests|demos)\// {print $2}' | sort -u | xargs)

            [ -z "$TESTS" ] && echo "Warning: No valid test/demo files changed." || echo "Dynamically detected tests: $TESTS"

          elif [[ "$PADDED_LABELS" == *" quick-test "* || "$PADDED_LABELS" == *" CI/CD "* ]]; then
            TESTS="bping cfdpv1 ams-sana ltp-cancel-ack-regression tcpcl-dos bibect conformance_test"
            echo "Quick-test/CI label detected. Tests: $TESTS"

          else
            echo "Standard PR push. Running ALL tests."
          fi

          echo "tests_to_run=$TESTS" >> $GITHUB_OUTPUT
          echo "enable_retest_value=$ENABLE_RETEST_VALUE" >> $GITHUB_OUTPUT

  run-solaris-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.needs-tests == 'true' }}
    uses: ./.github/workflows/ci-workflow-solaris.yml
    with:
      tests_to_run: ${{ needs.detect-changes.outputs.tests-subset }}
      env_vars: ${{ needs.detect-changes.outputs.enable_retest_value }} ${{ inputs.env_vars }}
      pr_number: ${{ needs.detect-changes.outputs.pr-number }}
      update_pr_status: false
    secrets: inherit

  run-arc-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.needs-tests == 'true' }}
    uses: ./.github/workflows/ci-workflow-arc.yml
    with:
      tests_to_run: ${{ needs.detect-changes.outputs.tests-subset }}
      env_vars: ${{ needs.detect-changes.outputs.enable_retest_value }} ${{ inputs.env_vars }}
      pr_number: ${{ needs.detect-changes.outputs.pr-number }}
      update_pr_status: false
      runner_u22: true
      runner_u24: true
      runner_ol8: true
      runner_ol9: true
      runner_rhel8: true
      runner_rhel9: true

  set-final-pr-status:
    needs: [detect-changes, run-solaris-tests, run-arc-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # Post failure statuses when detect-changes was cancelled or never produced
      # a needs-tests output (e.g., workflow cancelled before detect-changes
      # reached the "Set final needs-tests" step, or the job never started).
      - name: Set Failed Statuses for cancelled runs
        if: ${{ github.event_name == 'pull_request' &&
                (needs.detect-changes.result == 'cancelled' ||
                 (needs.detect-changes.result != 'success' && needs.detect-changes.result != 'skipped' && needs.detect-changes.outputs.needs-tests == '')) }}
        uses: actions/github-script@v7
        with:
          script: |
            const requiredContexts = [
              'ci/solaris',
              'ci/arc-runner-set-u22',
              'ci/arc-runner-set-u24',
              'ci/arc-runner-set-ol8',
              'ci/arc-runner-set-ol9',
              'ci/arc-runner-set-rhel8',
              'ci/arc-runner-set-rhel9'
            ];

            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : null;

            if (!prNumber) {
               console.log("No PR detected. Skipping status updates.");
               return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            for (const statusContext of requiredContexts) {
              console.log(`Setting ${statusContext} to failure (workflow cancelled during detect-changes)`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: 'failure',
                context: statusContext,
                description: 'Tests cancelled (Workflow was cancelled)'
              });
            }

      - name: Set Solaris PR Status
        if: ${{ needs.run-solaris-tests.outputs.status != '' }}
        uses: ./.github/actions/set-pr-status
        with:
          pr_number: ${{ needs.detect-changes.outputs.pr-number }}
          context: "ci/solaris"
          state: ${{ needs.run-solaris-tests.outputs.status }}

      - name: Set ARC PR Statuses
        if: ${{ needs.run-arc-tests.outputs.status_payload != '' }}
        uses: ./.github/actions/set-pr-status
        with:
          pr_number: ${{ needs.detect-changes.outputs.pr-number }}
          status_payload: ${{ needs.run-arc-tests.outputs.status_payload }}

  skip-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.needs-tests == 'false' && needs.detect-changes.outputs.is-duplicate != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Bypassed Statuses to GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const requiredContexts = [
              'ci/solaris',
              'ci/arc-runner-set-u22',
              'ci/arc-runner-set-u24',
              'ci/arc-runner-set-ol8',
              'ci/arc-runner-set-ol9',
              'ci/arc-runner-set-rhel8',
              'ci/arc-runner-set-rhel9'
            ];

            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : null;

            // If triggered manually without a PR, we don't need to post statuses
            if (!prNumber) {
               console.log("No PR detected. Skipping status updates.");
               return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            for (const statusContext of requiredContexts) {
              console.log(`Bypassing tests: Setting ${statusContext} to success`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: 'success',
                context: statusContext,
                description: 'Tests bypassed (Draft PR or no relevant files changed)'
              });
            }
