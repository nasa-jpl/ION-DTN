version: 2

python:
  install:
    - method: uv
      command: sync
      path: site-docs/

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - perl
    - cpanminus
  jobs:
    pre_create_environment:
      # Install the required Perl module
      # URI is pinned to a floor (>=), not an exact version: CPAN drops old point
      # releases, so `URI@5.34` started failing once 5.35 shipped ("Found URI 5.35
      # which doesn't satisfy == 5.34").  `~5.34` keeps the minimum while tolerating
      # CPAN patch bumps.
      - cpanm --from https://www.cpan.org MIME::Base32@1.303 URI~5.34 Pod::Markdown@3.400
      - chmod +x ./site-docs/docs/convert-pod-to-md.sh
      - cd ./site-docs/docs && ./convert-pod-to-md.sh  # Script to convert POD to Markdown
    build:
      html:
        - cd ./site-docs && zensical build
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site-docs/site/* $READTHEDOCS_OUTPUT/html/
