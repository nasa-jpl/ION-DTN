name: Regression Tests for ION on Solaris 11

concurrency:
  group: solaris-ci
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write
  pull-requests: read

on:
  workflow_call:
    inputs:
      tests_to_run:
        description:
          'Space-separated list of tests to run (e.g., "test1 test2").
          Leave blank to run all.'
        required: false
        type: string
        default: ""
      runner_count:
        description: "Number of runners to use within a runner set (default: 7)"
        required: false
        type: number
        default: 7
      env_vars:
        description:
          'Space-separated list of environment variables (e.g., "KEY1=VALUE1
          KEY2=VALUE2").'
        required: false
        type: string
        default: ""
      timeout_minutes:
        description:
          "Timeout for build and tests in minutes (default: 90 minutes / 1.5
          hours)"
        required: false
        type: number
        default: 90
      pr_number:
        description:
          "Optional PR number to use for status reporting. If left blank, the
          workflow will attempt to auto-detect it."
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      tests_to_run:
        description:
          'Space-separated list of tests to run (e.g., "test1 test2").
          Leave blank to run all.'
        required: false
        type: string
        default: ""
      runner_count:
        description: "Number of runners to use within a runner set (default: 7)"
        required: false
        type: number
        default: 7
      env_vars:
        description:
          'Space-separated list of environment variables (e.g., "KEY1=VALUE1
          KEY2=VALUE2").'
        required: false
        type: string
        default: ""
      timeout_minutes:
        description:
          "Timeout for build and tests in minutes (default: 90 minutes / 1.5
          hours)"
        required: false
        type: number
        default: 90
      pr_number:
        description:
          "Optional PR number to use for status reporting. If left blank, the
          workflow will attempt to auto-detect it."
        required: false
        type: string
        default: ""

env:
  VM_WORK_DIR: ~/ion-gh-test-dir
  PYTHON_VERSION: "3.11.15"

jobs:
  generate-matrix:
    runs-on: arc-runner-set-ol9
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      count: ${{ steps.generate.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate test distribution matrix
        id: generate
        uses: ./.github/actions/generate-test-matrix
        with:
          tests_to_run: ${{ inputs.tests_to_run }}
          runner_count: ${{ inputs.runner_count }}
          is_solaris: "true"

  build-ion:
    needs: validate-vms
    runs-on: arc-runner-set-ol9
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Cache Solaris Build Artifact
        id: cache-build
        uses: actions/cache@v5
        with:
          path: ion-build-solaris.tar.gz
          key: solaris-build-${{ hashFiles('**/*.c', '**/*.h', 'configure.ac', 'Makefile.am', 'build-bsl-for-ion.sh') }}

      - name: Setup Solaris SSH Configuration
        if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/setup-solaris-ssh
        with:
          ssh_key: ${{ secrets.SOLARIS_SSH_KEY }}
          host_1_ip: ${{ secrets.SOLARIS_HOST_1_IP }}
          host_2_ip: ${{ secrets.SOLARIS_HOST_2_IP }}

      - name: Display Runner Host OS and Arch
        if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
        run: |
          cat /etc/os-release
          echo "Arch:"
          uname -m
          echo "User ID:"
          id

      - name: Set environment variable to an available VM
        if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
        run: |
          if [ "${{ needs.validate-vms.outputs.dsoc3_available }}" == "true" ]; then
            echo "Selected dsoc3 for the build process."
            echo "VM_IP=dsoc3" >> $GITHUB_ENV
          elif [ "${{ needs.validate-vms.outputs.dsoc4_available }}" == "true" ]; then
            echo "dsoc3 is unavailable. Falling back to dsoc4 for the build process."
            echo "VM_IP=dsoc4" >> $GITHUB_ENV
          else
            echo "::error::No VMs are available for building!"
            exit 1
          fi

      - name: Copy code to Solaris VM
        if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
        run: |
          cd .github/ansible
          /home/runner/.pyenv/versions/${{ env.PYTHON_VERSION }}/bin/ansible-playbook copy-code.yml \
            -i "$VM_IP," \
            -e "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            -e "VM_WORK_DIR=${{ env.VM_WORK_DIR }}" \
            -v

      - name: Generate timestamp for file names
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Run build and buildcheck, capture stdout
        if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || 90 ) }}
        run: |
          ssh github-runner@$VM_IP '
            export MAKE_CMD=gmake
            cd ~/ion-gh-test-dir/ion-ios-dev
            sh .github/scripts/compile-and-buildcheck.sh
          ' > compile-and-buildcheck.log 2> >(tee -a compile-and-buildcheck.log >&2)

          BUILD_STATUS=$?

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Build and buildcheck failed with status $BUILD_STATUS" >&2
            exit $BUILD_STATUS
          fi

      - name: Process artifact and clean up VM
        if: ${{ always() && steps.cache-build.outputs.cache-hit != 'true' }}
        env:
          # Explicitly point to the config file so Ansible knows to use github-runner
          ANSIBLE_CONFIG: .github/ansible/ansible.cfg
        run: |
          /home/runner/.pyenv/versions/${{ env.PYTHON_VERSION }}/bin/ansible-playbook -i "$VM_IP," .github/ansible/process-artifact.yml \
            -e "run_id=${{ github.run_id }}"

      - name: Format artifact for caching
        if: ${{ steps.cache-build.outputs.cache-hit != 'true' }}
        run: cp ion-build-${{ github.run_id }}.tar.gz ion-build-solaris.tar.gz

      - name: Restore run-specific artifact from cache
        if: ${{ steps.cache-build.outputs.cache-hit == 'true' }}
        run: cp ion-build-solaris.tar.gz ion-build-${{ github.run_id }}.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ion-build-${{ github.run_id }}
          path: ion-build-${{ github.run_id }}.tar.gz
          if-no-files-found: error

      - name: Upload compile and buildcheck log
        if: ${{ always() && steps.cache-build.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: compile-and-buildcheck-log-solaris-${{ steps.timestamp.outputs.timestamp }}
          path: compile-and-buildcheck.log

  validate-vms:
    name: Validate VM Connectivity
    runs-on: arc-runner-set-ol9
    outputs:
      dsoc3_available: ${{ steps.check-dsoc3.outputs.available }}
      dsoc4_available: ${{ steps.check-dsoc4.outputs.available }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Solaris SSH Configuration
        uses: ./.github/actions/setup-solaris-ssh
        with:
          ssh_key: ${{ secrets.SOLARIS_SSH_KEY }}
          host_1_ip: ${{ secrets.SOLARIS_HOST_1_IP }}
          host_2_ip: ${{ secrets.SOLARIS_HOST_2_IP }}

      - name: Check dsoc3 connectivity
        id: check-dsoc3
        run: |
          echo "Checking connectivity to dsoc3..."

          if ssh -o ConnectTimeout=10 github-runner@dsoc3 'echo "Connected"' 2>&1; then
            echo "✓ dsoc3 is reachable"
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "✗ dsoc3 is not reachable"
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Check dsoc4 connectivity
        id: check-dsoc4
        run: |
          echo "Checking connectivity to dsoc4..."

          if ssh -o ConnectTimeout=10 github-runner@dsoc4 'echo "Connected"' 2>&1; then
            echo "✓ dsoc4 is reachable"
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "✗ dsoc4 is not reachable"
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify at least one VM is available
        run: |
          if [ "${{ steps.check-dsoc3.outputs.available }}" != "true" ] && [ "${{ steps.check-dsoc4.outputs.available }}" != "true" ]; then
            echo "::error::No Solaris VMs are reachable. Both dsoc3 and dsoc4 failed connectivity checks."
            exit 1
          fi

          echo "VM connectivity validated successfully"

  create-zones:
    name: Create Zones (${{ matrix.vm }})
    needs: [build-ion, generate-matrix]
    runs-on: arc-runner-set-ol9
    strategy:
      fail-fast: false
      matrix:
        vm: [dsoc3, dsoc4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Solaris SSH Configuration
        uses: ./.github/actions/setup-solaris-ssh
        with:
          ssh_key: ${{ secrets.SOLARIS_SSH_KEY }}
          host_1_ip: ${{ secrets.SOLARIS_HOST_1_IP }}
          host_2_ip: ${{ secrets.SOLARIS_HOST_2_IP }}

      - name: Prepare Ansible variables
        run: |
          # We pass the full matrix of zones; the playbook automatically
          # filters for zones where vm == inventory_hostname
          cat << 'EOF' > .github/ansible/zones_matrix.json
          {
            "run_id": "${{ github.run_id }}",
            "all_zones": ${{ needs.generate-matrix.outputs.matrix }}
          }
          EOF

      - name: Execute Parallel Zone Creation
        id: create-zones
        run: |
          cd .github/ansible

          # Execute Ansible targeting ONLY the specific VM for this runner
          /home/runner/.pyenv/versions/${{ env.PYTHON_VERSION }}/bin/ansible-playbook create-zones-parallel.yml \
            -i "${{ matrix.vm }}," \
            -e "@zones_matrix.json" \
            -v

  test-parallel:
    needs: [build-ion, generate-matrix, create-zones]
    strategy:
      fail-fast: false
      matrix:
        test_group: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    runs-on: arc-runner-set-ol9
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || 90 ) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Solaris SSH Configuration
        uses: ./.github/actions/setup-solaris-ssh
        with:
          ssh_key: ${{ secrets.SOLARIS_SSH_KEY }}
          host_1_ip: ${{ secrets.SOLARIS_HOST_1_IP }}
          host_2_ip: ${{ secrets.SOLARIS_HOST_2_IP }}

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ion-build-${{ github.run_id }}
          path: ./artifacts

      - name: Overlay fresh test scripts over cached binaries
        run: |
          /home/runner/.pyenv/versions/${{ env.PYTHON_VERSION }}/bin/ansible-playbook \
            .github/ansible/overlay-fresh-tests.yml \
            -e "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            -e "ARTIFACT_PATH=$GITHUB_WORKSPACE/artifacts/ion-build-${{ github.run_id }}.tar.gz" \
            -e "RUN_ID=${{ github.run_id }}" \
            -v

      - name: Copy artifact to VM
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_seconds: 600
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            cd .github/ansible
            /home/runner/.pyenv/versions/${{ env.PYTHON_VERSION }}/bin/ansible-playbook distribute-artifacts.yml \
              -i "${{ matrix.test_group.vm_hostname }}," \
              -e "RUN_ID=${{ github.run_id }}" \
              -e "JOB_INDEX=${{ matrix.test_group.job_index }}" \
              -e "OPERATION=push" \
              -v

      - name: Run tests
        id: tests
        run: |
          scp .github/ansible/run-tests-in-zone.sh \
            github-runner@${{ matrix.test_group.vm_hostname }}:~/run-tests-${{ github.run_id }}-${{ matrix.test_group.job_index }}.sh

          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 github-runner@${{ matrix.test_group.vm_hostname }} \
            "chmod +x ~/run-tests-${{ github.run_id }}-${{ matrix.test_group.job_index }}.sh && \
             sudo ~/run-tests-${{ github.run_id }}-${{ matrix.test_group.job_index }}.sh \
             '${{ github.run_id }}' \
             '${{ matrix.test_group.job_index }}' \
             '${{ matrix.test_group.tests }}' \
             '${{ inputs.env_vars || '' }}'"

      - name: Use Ansible playbook to collect results
        if: always()
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_seconds: 300
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            cd .github/ansible
            /home/runner/.pyenv/versions/${{ env.PYTHON_VERSION }}/bin/ansible-playbook distribute-artifacts.yml \
              -i "${{ matrix.test_group.vm_hostname }}," \
              -e "RUN_ID=${{ github.run_id }}" \
              -e "JOB_INDEX=${{ matrix.test_group.job_index }}" \
              -e "OPERATION=pull" \
              -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}-job-${{ matrix.test_group.job_index }}
          path: .github/ansible/test-results/

  aggregate-results:
    name: "Finalize Logs and Reports"
    needs: test-parallel
    # Note: if: always() runs when dependencies fail/succeed but NOT when workflow is cancelled
    # The cleanup step uses if: success() to preserve artifacts when this job is skipped
    if: always()
    runs-on: arc-runner-set-ol9

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate timestamp for final bundle
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Download ALL artifacts
        id: download-artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-${{ github.run_id }}-job-*
          path: all-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Check if artifacts were downloaded
        id: check-artifacts
        run: |
          if [ -d "all-artifacts" ] && [ "$(ls -A all-artifacts)" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✓ Found test result artifacts to bundle"
            ls -la all-artifacts/
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠ No test result artifacts found to bundle"
          fi

      - name: Generate Final Summary Table and Status
        id: test-status
        if: steps.check-artifacts.outputs.found == 'true'
        run: bash .github/scripts/generate-test-summary.sh
        continue-on-error: true

      - name: Set PR status
        if: steps.check-artifacts.outputs.found == 'true'
        uses: ./.github/actions/set-pr-status
        with:
          pr_number: ${{ inputs.pr_number }}
          context: "ci/solaris"
          state: ${{ steps.test-status.outputs.status }}
        continue-on-error: true

      - name: Remove artifacts from the bundle folder
        if: steps.check-artifacts.outputs.found == 'true'
        run: |
          echo "Removing build artifacts before bundling..."
          rm -rf all-artifacts/ion-build-*

      - name: Upload Unified Bundle
        if: steps.check-artifacts.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: final-solaris-bundle-${{ steps.timestamp.outputs.timestamp }}
          path: all-artifacts/

      - name: Clean up ALL intermediate artifacts
        # Only delete intermediate artifacts if workflow completed normally
        # Skip cleanup if workflow was cancelled or failed to preserve debugging artifacts
        if: success()
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118
        with:
          name: |
            test-results-*-job-*
            compile-and-buildcheck-log-solaris-*
            ion-build-*

  destroy-zones:
    name: Destroy Zones (${{ matrix.vm }})
    needs: [generate-matrix, create-zones, aggregate-results, validate-vms]
    # Run even if tests fail, but only if we actually created zones
    if: ${{ always() && needs.create-zones.result != 'skipped' }}
    runs-on: arc-runner-set-ol9
    strategy:
      fail-fast: false
      matrix:
        vm: [dsoc3, dsoc4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Solaris SSH Configuration
        uses: ./.github/actions/setup-solaris-ssh
        with:
          ssh_key: ${{ secrets.SOLARIS_SSH_KEY }}
          host_1_ip: ${{ secrets.SOLARIS_HOST_1_IP }}
          host_2_ip: ${{ secrets.SOLARIS_HOST_2_IP }}

      - name: Prepare Ansible Variables
        id: prep-vars
        run: |
          cat << 'EOF' > zones.json
          ${{ needs.generate-matrix.outputs.matrix }}
          EOF

          JOB_INDEXES=$(jq -c '[.[] | select(.vm_hostname == "${{ matrix.vm }}") | .job_index]' zones.json)
          echo "indexes=$JOB_INDEXES" >> $GITHUB_OUTPUT

          cat << EOF > .github/ansible/destroy_vars.json
          {
            "run_id": "${{ github.run_id }}",
            "job_indexes": $JOB_INDEXES
          }
          EOF

      - name: Execute Parallel Zone Destruction
        run: |
          cd .github/ansible

          # Pass the variables file using the @ syntax
          /home/runner/.pyenv/versions/${{ env.PYTHON_VERSION }}/bin/ansible-playbook destroy-zone.yml \
            -i "${{ matrix.vm }}," \
            -e "@destroy_vars.json" \
            -v
