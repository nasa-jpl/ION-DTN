name: Run All PR Tests

permissions:
  contents: read
  statuses: write
  pull-requests: read

on:
  pull_request:
    # Adding labeled/unlabeled ensures the workflow re-evaluates if you add the label later
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: ["integration"]
  workflow_dispatch:
    inputs:
      tests_to_run:
        description: "Space-separated subset of tests for a quick run (leave blank for all)"
        required: false
        type: string
        default: ""
      env_vars:
        description: 'Space-separated list of environment variables (e.g., "KEY1=VALUE1 KEY2=VALUE2").'
        required: false
        type: string
        default: ""

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      needs-tests: ${{ steps.filter.outputs.relevant_changes }}
      tests-subset: ${{ steps.determine-tests.outputs.tests_to_run }}
      pr-number: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            relevant_changes:
              - '**/*.c'
              - '**/*.h'
              - 'configure.ac'
              - 'Makefile.am'
              - 'build-bsl-for-ion.sh'
              - '.github/workflows/ci-workflow-arc.yml'
              - '.github/workflows/ci-workflow-solaris.yml'
              - '.github/workflows/ci-run-PR-tests.yml'
              - '.github/ansible/*'
              - '.github/scripts/*'
              - '.github/actions/*'
              - 'tests/**'
              - 'demos/**'
              - 'killm'

      - name: Determine Test Subset
        id: determine-tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TESTS=""

          IS_QUICK="${{ contains(github.event.pull_request.labels.*.name, 'quick-test') }}"
          IS_CI_CD="${{ contains(github.event.pull_request.labels.*.name, 'CI/CD') }}"
          IS_TEST_MODS="${{ contains(github.event.pull_request.labels.*.name, 'test-mods') }}"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TESTS="${{ inputs.tests_to_run }}"
            echo "Manual trigger detected. Tests to run: $TESTS"

          elif [ "$IS_TEST_MODS" == "true" ]; then
            echo "'test-mods' label detected. Analyzing changed files in tests/ and demos/..."
            PR_NUMBER="${{ github.event.pull_request.number }}"

            # Fetch changed files for this PR via the GitHub API
            CHANGED_FILES=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/files --paginate --jq '.[].filename')

            TESTS_LIST=""
            for FILE in $CHANGED_FILES; do
              # Check if the file is in the tests or demos directories
              if [[ "$FILE" == tests/* ]] || [[ "$FILE" == demos/* ]]; then
                # Extract the directory immediately following tests/ or demos/
                # e.g., tests/bping/dotest -> bping/dotest
                TEMP_FILE="${FILE#*/}"

                # Strip everything after the next slash to get the directory name
                # e.g., bping/dotest -> bping
                TEST_DIR="${TEMP_FILE%%/*}"
                TESTS_LIST="$TESTS_LIST $TEST_DIR"
              fi
            done

            # Deduplicate the list
            mapfile -t UNIQUE_TESTS < <(echo "$TESTS_LIST" | tr -s ' ' '\n' | sort -u | grep '.')

            # Expand the array back into a safe, space-separated string
            TESTS="${UNIQUE_TESTS[*]}"

            if [ -z "$TESTS" ]; then
              echo "Warning: 'test-mods' label is present, but no files in tests/ or demos/ were changed. 'tests_to_run' is empty."
            else
              echo "Dynamically detected tests to run: $TESTS"
            fi

          elif [ "$IS_QUICK" == "true" ] || [ "$IS_CI_CD" == "true" ]; then
            TESTS="bping cfdpv1 ams-sana ltp-cancel-ack-regression tcpcl-dos bibect conformance_test"
            echo "Quick-test label detected. Tests to run: $TESTS"

          else
            echo "Standard PR push detected. Running ALL tests."
          fi

          echo "tests_to_run=$TESTS" >> $GITHUB_OUTPUT

  run-solaris-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.needs-tests == 'true' }}
    uses: ./.github/workflows/ci-workflow-solaris.yml
    with:
      tests_to_run: ${{ needs.detect-changes.outputs.tests-subset }}
      env_vars: ${{ inputs.env_vars }}
      pr_number: ${{ needs.detect-changes.outputs.pr-number }}
    secrets: inherit

  run-arc-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.needs-tests == 'true' }}
    uses: ./.github/workflows/ci-workflow-arc.yml
    with:
      tests_to_run: ${{ needs.detect-changes.outputs.tests-subset }}
      env_vars: ${{ inputs.env_vars }}
      pr_number: ${{ needs.detect-changes.outputs.pr-number }}
      runner_u20: true
      runner_u22: true
      runner_ol8: true
      runner_ol9: true
      runner_rhel8: true
      runner_rhel9: true

  # Skip tests and satisfy the Rulesets
  skip-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.needs-tests == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Bypassed Statuses to GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const requiredContexts = [
              'ci/solaris',
              'ci/arc-runner-set-u20',
              'ci/arc-runner-set-u22',
              'ci/arc-runner-set-ol8',
              'ci/arc-runner-set-ol9',
              'ci/arc-runner-set-rhel8',
              'ci/arc-runner-set-rhel9'
            ];

            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : null;

            // If triggered manually without a PR, we don't need to post statuses
            if (!prNumber) {
               console.log("No PR detected. Skipping status updates.");
               return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            for (const statusContext of requiredContexts) {
              console.log(`Bypassing tests: Setting ${statusContext} to success`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: 'success',
                context: statusContext,
                description: 'Tests bypassed (no relevant files changed)'
              });
            }
