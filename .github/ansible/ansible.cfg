[defaults]
# Basic configuration for Solaris Zone management
host_key_checking = False
remote_user = github-runner
timeout = 30
# Cap parallelism to prevent SSH daemon overload
forks = 10
# Swap values no_log to false and debug to true
# to enable Ansible debug output
no_log = True
debug = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Increase timeout for zone operations that may take time
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=30
pipelining = True
