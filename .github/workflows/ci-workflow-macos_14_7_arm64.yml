name: Regression Tests for ION on MacOS 14.7 ARM64

on:
#  pull_request:
#    branches:
#      - integration

  workflow_dispatch:

#  push:
#    branches:
#      - update-4.1.4-freebsd-update

jobs:
  build-and-test:
    runs-on: [self-hosted, macOS, ARM64, 14.7]

    steps:
      - name: Clean up workspace
        run: |
          rm -rf $GITHUB_WORKSPACE/*
          
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # assume dependencies are all already setup

      - name: Display OS and Arch
        run: |
          echo "Arch:"
          uname -m
          echo "User ID:"
          id
          echo "DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH"

      - name: Generate timestamp for file names
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Run build and tests, capture stdout
        run: |
          {
            echo "Starting build and tests at $(date)"
            export USER=$(whoami)  # Set USER to the current username
            echo "USER is set to: $USER"
            export PATH="/opt/homebrew/bin:$PATH"
            export ION_RUN_EXPERT="yes"
            export DYLD_LIBRARY_PATH=/usr/local/lib:$DYLD_LIBRARY_PATH
            autoreconf -fi
            ./configure --enable-crypto-mbedtls --enable-bpsec-debugging
            make -j4
            sudo make install
            make buildcheck
            sudo ./fix-macos-mbedtls-lib-links.sh /usr/local/lib /usr/local/bin ./
            cd tests
            ./runtests
            echo $? > runtests_exit_code  # Save runtests exit code
          } > build-and-test.log 2>&1  # pipe to stdout for identification of failed test in RT
          # Propagate the saved exit code
          exit $(cat runtests_exit_code)

      - name: Display Progress
        if: ${{ always() }}  # Display progress even if tests were interrupted
        run: |
          cat ./tests/progress | grep "FAILED" || { printf "No failed tests. \n"; exit 0; }

      - name: Upload full build and test log
        if: ${{ always() }}  # Capture log even if the previous step fails
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-log-${{ env.TIMESTAMP }}
          path: build-and-test.log  # Upload the entire stdout and stderr as an artifact

      - name: Upload progress file as artifact
        if: ${{ always() }}  # Capture progress even if the previous step fails
        uses: actions/upload-artifact@v4
        with:
          name: test-progress-${{ env.TIMESTAMP }}
          path: ./tests/progress  # Upload the 'progress' file for later review

      - name: Clean up ION build
        if: ${{ always() }}  # Clean up even if previous steps fails
        run: |
          killm
          sudo make uninstall
          make clean
          make distclean
          rm -rf $GITHUB_WORKSPACE/*

