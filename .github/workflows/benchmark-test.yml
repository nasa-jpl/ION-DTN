name: Benchmark Tests

on:
  pull_request:
    paths:
      - "tests/**"
      - "demos/**"
  workflow_call:
    inputs:
      tests_to_run:
        description: 'Space-separated list of tests to run (e.g., "test1 test2"). Leave blank to run all.'
        required: false
        type: string
        default: ""
      force_update:
        description: "Force update .DURATION files (only works when specific tests are provided)"
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description: "Timeout for test benchmark in minutes (default: 60 minutes / 1 hour)"
        required: false
        type: number
        default: 90
  workflow_dispatch:
    inputs:
      tests_to_run:
        description: 'Space-separated list of tests to run (e.g., "test1 test2"). Leave blank to run all.'
        required: false
        type: string
        default: ""
      force_update:
        description: "Force update .DURATION files (only works when specific tests are provided)"
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description: "Timeout for test benchmark in minutes (default: 60 minutes / 1 hour)"
        required: false
        type: number
        default: 60

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-benchmarks:
    runs-on: arc-runner-set-u22

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Generate timestamp for file names
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Install and run benchmark
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '60') }}
        run: |
          {
            echo "Starting test installation and execution at $(date)"
            export USER=$(whoami)
            echo "USER is set to: $USER"
            export ION_RUN_EXPERT="yes"
            export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
            autoreconf -fi
            ./configure --enable-crypto-mbedtls --enable-bpsec-debugging
            make all buildcheck
            sudo make install
            sudo ldconfig
            if [ -n "${{ inputs.tests_to_run }}" ]; then
              if [ "${{ inputs.force_update }}" == "true" ]; then
                echo "Force updating benchmarks for: ${{ inputs.tests_to_run }}"
                ./tests/benchmark.py -p ${{ inputs.tests_to_run }} -f
              else
                ./tests/benchmark.py -p ${{ inputs.tests_to_run }}
              fi
            else
              if [ "${{ inputs.force_update }}" == "true" ]; then
                echo "⚠️ Warning: Force update ignored - only works when specific tests are provided via tests_to_run"
              fi
              ./tests/benchmark.py
            fi
          } > benchmark.log 2> >(tee -a benchmark.log >&2)

          TEST_STATUS=$?

          if [ $TEST_STATUS -ne 0 ]; then
            echo "Tests failed with status $TEST_STATUS" >&2
            exit $TEST_STATUS
          fi

      - name: Upload full test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-install-log-${{ steps.timestamp.outputs.timestamp }}
          path: benchmark.log

      - name: Upload benchmark stdout logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-logs-${{ steps.timestamp.outputs.timestamp }}
          path: |
            tests/**/*.stdout
            demos/**/*.stdout

      - name: Benchmark summary
        if: ${{ always() }}
        run: |
          echo "## 📊 Benchmark Failures" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|----------|" >> $GITHUB_STEP_SUMMARY
          if [ -f benchmark_results.txt ]; then
            # Check if there are any failures in the file
            if grep -q "FAILED" benchmark_results.txt; then
              # Read only the lines that failed
              grep "FAILED" benchmark_results.txt | while IFS="|" read -r test_name result || [ -n "$test_name" ]; do
                test_name=$(echo "$test_name" | xargs)
                [ -z "$test_name" ] && continue

                echo "| $test_name | ❌ |" >> $GITHUB_STEP_SUMMARY
              done
            else
              # If grep doesn't find "FAILED", all tests passed
              echo "| 🎉 All tests passed! | ✅ |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| *N/A* | *benchmark_results.txt not found* |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit newly generated .DURATION files
        if: ${{ always() }}
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403
        with:
          commit_message: "Add .DURATION file(s) for benchmarked tests"
          file_pattern: "tests/**/.DURATION demos/**/.DURATION"
