name: Regression Tests for ION on Ubuntu

permissions:
  contents: read
  statuses: write
  pull-requests: read

on:
  workflow_call:
    inputs:
      tests_to_run:
        description: 'Space-separated list of tests to run (e.g., "test1 test2"). Leave blank to run all.'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'The PR number this test is associated with.'
        required: false
        type: string
        default: ''
      env_vars:
        description: 'Space-separated list of environment variables (e.g., "KEY1=VALUE1 KEY2=VALUE2").'
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: 'Timeout for build and tests in minutes (default: 240 minutes / 4 hours)'
        required: false
        type: number
        default: 240

  workflow_dispatch:
    inputs:
      tests_to_run:
        description: 'Space-separated list of tests to run (e.g., "test1 test2"). Leave blank to run all.'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'The PR number this test is associated with.'
        required: false
        type: string
        default: ''
      env_vars:
        description: 'Space-separated list of environment variables (e.g., "KEY1=VALUE1 KEY2=VALUE2").'
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: 'Timeout for build and tests in minutes (default: 240 minutes / 4 hours)'
        required: false
        type: number
        default: 240

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true
          # clear workspace after

      - name: Auto-detect PR number
        id: detect-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.pr_number }}" ]; then
            echo "pr_number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            PR_NUM=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$PR_NUM" ]; then
              echo "Auto-detected PR #${PR_NUM} for branch ${{ github.ref_name }}"
              echo "pr_number=${PR_NUM}" >> $GITHUB_OUTPUT
            else
              echo "No PR found for branch ${{ github.ref_name }}"
              echo "pr_number=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Display OS and Arch
        run: |
          cat /etc/os-release
          echo "Arch:"
          uname -m
          echo "User ID:"
          id
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool bash python3 gcc make wget iptables

      - name: Install MBEDTLS 2.28.9
        run: |
          wget https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-2.28.9/mbedtls-2.28.9.tar.bz2
          sha256sum "mbedtls-2.28.9.tar.bz2" | grep -q "^e85ea97aaf78dd6c0a5ba2e54dd5932ffa15f39abfc189c26beef7684630c02b " || exit 1
          tar -jvxf mbedtls-2.28.9.tar.bz2
          cd mbedtls-2.28.9/
          sed -i '/#define MBEDTLS_NIST_KW_C/s/\/\///' "./include/mbedtls/config.h"
          make SHARED=1
          make check
          sudo make install

      - name: Generate timestamp for file names
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Run build and tests, capture stdout
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '270') }}
        run: |
          {
            echo "Starting build and tests at $(date)"
            export ION_RUN_EXPERT="yes"
            export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
            export PRESERVE_TEST_LOGS="yes"
            autoreconf -fi
            ./configure --enable-crypto-mbedtls --enable-bpsec-debugging
            make -j4
            sudo make install
            make buildcheck
            sudo ldconfig
            cd tests
            # Set environment variables if provided
            if [ -n "${{ github.event.inputs.env_vars }}" ]; then
              echo "Setting environment variables: ${{ github.event.inputs.env_vars }}"
              for env_var in ${{ github.event.inputs.env_vars }}; do
                export "$env_var"
              done
            fi
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tests_to_run }}" ]; then
              echo "Running specific tests: ${{ github.event.inputs.tests_to_run }}"
              ./runtests ${{ github.event.inputs.tests_to_run }}
            else
              echo "Running all tests"
              ./runtests
            fi
          } > build-and-test.log 2> >(tee -a build-and-test.log >&2)

          TEST_STATUS=$?

          if [ $TEST_STATUS -ne 0 ]; then
            echo "Build and tests failed with status $TEST_STATUS" >&2
            exit $TEST_STATUS
          fi

      - name: Display Progress
        if: ${{ always() }}
        run: |
          cat ./tests/progress | grep "FAILED" || { printf "No failed tests.\n"; exit 0; }

      - name: Upload full build and test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-and-test-log-ubuntu-latest-${{ env.TIMESTAMP }}
          path: build-and-test.log

      - name: Show progress file
        if: ${{ always() }}
        run: |
          echo "Contents of ./tests/progress:"
          cat ./tests/progress || echo "No progress file found."

      - name: Upload progress file as artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-progress-ubuntu-latest-${{ env.TIMESTAMP }}
          path: ./tests/progress

      - name: Collect and upload ion.log files from all test directories
        if: ${{ always() }}
        run: |
          echo "Collecting ion.log files with unique names..."
          mkdir -p ion-logs-collection
          find ./tests -name "ion.log" -type f | while IFS= read -r logfile; do
            # Extract test path and create unique filename
            # e.g., ./tests/admin_public_api/ltp_loopback/ion.log -> admin_public_api-ltp_loopback-ion.log
            # e.g., ./tests/issue-352-bpcp-stcp/1.ipn.cfdp.bp.stcp/ion.log -> issue-352-bpcp-stcp-1.ipn.cfdp.bp.stcp-ion.log
            relpath=$(echo "$logfile" | sed 's|^\./tests/||' | sed 's|/ion\.log$||')
            unique_name=$(echo "$relpath" | tr '/' '-')
            cp "$logfile" "ion-logs-collection/${unique_name}-ion.log"
            echo "Collected: $logfile -> ion-logs-collection/${unique_name}-ion.log"
          done

          # List all collected logs for verification
          echo "Collected ion.log files:"
          find ion-logs-collection -name "*.log" -type f | sort

      - name: Upload ion.log files as artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ion-logs-ubuntu-latest-${{ env.TIMESTAMP }}
          path: ion-logs-collection/
          if-no-files-found: warn

      - name: Set PR status
        if: ${{ steps.detect-pr.outputs.pr_number != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const conclusion = "${{ job.status }}" === "success" ? "success" : "failure";
            const prNumber = parseInt("${{ steps.detect-pr.outputs.pr_number }}", 10);

            let pr;
            try {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              pr = data;
            } catch (error) {
              console.log(`PR #${prNumber} not found: ${error.message}`);
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pr.head.sha,
              state: conclusion,
              context: "ci/ubuntu-latest",
              description: `Tests ${conclusion === "success" ? "passed" : "failed"}`,
              target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            });
