name: Regression Tests for ION on Ubuntu

on:
  pull_request:
    branches:
      - integration

  workflow_dispatch:

#  push:
#    branches:
#      - update-4.1.4-freebsd-update

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Checkout the code from the repository

      # Github Cloud Server container runs with passwordless `sudo`
      - name: Display OS and Arch
        run: |
          cat /etc/os-release
          echo "Arch:"
          uname -m
          echo "User ID:"
          id
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
      
      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool bash python3 gcc make wget iptables # Install dependencies

      - name: Install MBEDTLS 2.28.9
        run: |
            wget https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/mbedtls-2.28.9.tar.gz
            tar -zvxf mbedtls-2.28.9.tar.gz
            cd mbedtls-mbedtls-2.28.9/
            sed -i '/#define MBEDTLS_NIST_KW_C/s/\/\///' "./include/mbedtls/config.h"
            make SHARED=1
            make check
            sudo make install

      - name: Generate timestamp for file names
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Run build and tests, capture stdout
        run: |
          {
            echo "Starting build and tests at $(date)"
            export ION_RUN_EXPERT="yes"
            autoreconf -fi
            ./configure --enable-crypto-mbedtls --enable-bpsec-debugging
            make
            sudo make install
            make buildcheck
            sudo ldconfig
            cd tests
            ./runtests tcpcl-ack-resilience
          } > build-and-test.log 2>&1

      - name: Display Progress
        if: ${{ always() }}  # Display progress even if tests were interrupted
        run: | 
          cat ./tests/progress | grep "FAILED" || { printf "No failed tests. \n"; exit 0; }

      - name: Upload full build and test log
        if: ${{ always() }}  # Capture log even if the previous step fails
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-log-${{ env.TIMESTAMP }}
          path: build-and-test.log  # Upload the entire stdout and stderr as an artifact

      - name: Upload progress file as artifact
        if: ${{ always() }}  # Capture progress even if the previous step fails
        uses: actions/upload-artifact@v4
        with:
          name: test-progress-${{ env.TIMESTAMP }}
          path: ./tests/progress  # Upload the 'progress' file for later review
