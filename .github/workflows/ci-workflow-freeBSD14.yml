name: Regression Tests for ION on FreeBSD 14 VM via Ubuntu host

on:
#  pull_request:
#    branches:
#      - integration
  workflow_call:
    inputs:
      tests_to_run:
        description: 'Space-separated list of tests to run (e.g., "test1 test2"). Leave blank to run all.'
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: 'Timeout for build and tests in minutes (default: 240 minutes / 4 hours)'
        required: false
        type: number
        default: 240
  workflow_dispatch:
    inputs:
      tests_to_run:
        description: 'Space-separated list of tests to run (e.g., "test1 test2"). Leave blank to run all.'
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: 'Timeout for build and tests in minutes (default: 240 minutes / 4 hours)'
        required: false
        type: number
        default: 240

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64, karuna]
    steps:
      - name: Clean up workspace
        run: |
          rm -rf $GITHUB_WORKSPACE/*

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: true
          # clear workspace after

      - name: Display Runner Host OS and Arch
        run: |
          cat /etc/os-release 
          echo "Arch:" 
          uname -m
          echo "User ID:"
          id

      - name: Set environment variable to VM's static IP
        run: |
          echo "VM_IP=192.168.122.128" >> $GITHUB_ENV

      - name: Display VM OS and Arch
        run: |
          ssh -o StrictHostKeyChecking=no jgao@$VM_IP '
            cat /etc/os-release && 
            echo "Arch:" && 
            uname -m &&
            echo "User ID:" &&
            id &&
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"'

      - name: Copy code to FreeBSD VM
        run: |
          ssh -o StrictHostKeyChecking=no jgao@$VM_IP 'rm -rf ~/ion-gh-test-dir && mkdir -p ~/ion-gh-test-dir/ion-ios-dev'
          tar -czf - --exclude='arch-rtems' -C "$GITHUB_WORKSPACE" . | ssh -o StrictHostKeyChecking=no jgao@$VM_IP 'tar -xzf - -C ~/ion-gh-test-dir/ion-ios-dev'

      - name: Generate timestamp for file names
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Run build and tests, capture stdout
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '240') }}
        run: |
          ssh -o StrictHostKeyChecking=no jgao@$VM_IP '
            echo "Starting build and tests at $(date)" &&
            export USER=$(whoami) &&
            echo "USER is set to: $USER" &&
            export ION_RUN_EXPERT="yes" &&
            export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH &&
            export PRESERVE_TEST_LOGS="yes" &&
            export MAKE=gmake &&
            cd ~/ion-gh-test-dir/ion-ios-dev &&
            autoreconf -fi &&
            ./configure --enable-crypto-mbedtls --enable-bpsec-debugging &&
            gmake -j4 &&
            sudo gmake install &&
            gmake buildcheck &&
            sudo ldconfig &&
            cd tests &&
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tests_to_run }}" ]; then
              echo "Running specific tests: ${{ github.event.inputs.tests_to_run }}" &&
              ./runtests ${{ github.event.inputs.tests_to_run }}
            else
              echo "Running all tests" &&
              ./runtests
            fi' > build-and-test.log 2> >(tee -a build-and-test.log >&2)

          TEST_STATUS=$?
          wait  # Wait for background processes to complete

          if [ $TEST_STATUS -ne 0 ]; then
            echo "Build and tests failed with status $TEST_STATUS" >&2
            exit $TEST_STATUS
          fi

      - name: Display Progress
        if: ${{ always() }}
        run: |
          ssh -o StrictHostKeyChecking=no jgao@$VM_IP '
            cat ~/ion-gh-test-dir/ion-ios-dev/tests/progress' > progress
          cat progress | grep "FAILED" || { printf "No failed tests.\n"; exit 0; }

      - name: Upload full build and test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-log-freebsd-${{ env.TIMESTAMP }}
          path: build-and-test.log

      - name: Upload progress file as artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-progress-freebsd-${{ env.TIMESTAMP }}
          path: ./progress

      - name: Collect and upload ion.log files from VM
        if: ${{ always() }}
        run: |
          echo "Collecting ion.log files with unique names..."
          mkdir -p ion-logs-collection
          ssh -o StrictHostKeyChecking=no jgao@$VM_IP '
            cd ~/ion-gh-test-dir/ion-ios-dev &&
            find ./tests -name "ion.log" -type f' | while IFS= read -r logfile; do
            # Extract test path and create unique filename
            relpath=$(echo "$logfile" | sed 's|^\./tests/||' | sed 's|/ion\.log$||')
            unique_name=$(echo "$relpath" | tr '/' '-')
            scp -o StrictHostKeyChecking=no jgao@$VM_IP:~/ion-gh-test-dir/ion-ios-dev/"$logfile" "ion-logs-collection/${unique_name}-ion.log"
            echo "Collected: $logfile -> ion-logs-collection/${unique_name}-ion.log"
          done

          # List all collected logs for verification
          echo "Collected ion.log files:"
          find ion-logs-collection -name "*.log" -type f | sort

      - name: Upload ion.log files as artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ion-logs-freebsd-${{ env.TIMESTAMP }}
          path: ion-logs-collection/
          if-no-files-found: warn

      - name: Clean up ION build
        if: ${{ always() }}
        run: |
          ssh -o StrictHostKeyChecking=no jgao@$VM_IP '
            killm &&
            cd ~/ion-gh-test-dir/ion-ios-dev &&
            sudo gmake uninstall &&
            gmake clean &&
            cd ../.. &&
            rm -rf ~/ion-gh-test-dir'
          rm -rf $GITHUB_WORKSPACE/*