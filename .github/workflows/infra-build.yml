name: Build and Push Runner Images to Registry

on:
  push:
    branches: ["integration"]
    paths:
      - "images/**"
  workflow_dispatch:

env:
  REGISTRY_ADDRESS: ${{ secrets.REGISTRY_ADDRESS }}
  REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  XDG_RUNTIME_DIR: /run/user/1001

jobs:
  build-and-push-ol8:
    name: Build and Push ${{ matrix.os_image }}
    runs-on: arc-runner-set-ol8

    strategy:
      fail-fast: false
      matrix:
        os_image: [ubuntu-20, ubuntu-22, oraclelinux-8, oraclelinux-9]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to container registry
        run: |
          echo "${{ env.REGISTRY_PASSWORD }}" | sudo buildah login ${{ env.REGISTRY_ADDRESS }} --username "${{ env.REGISTRY_NAMESPACE }}" --password-stdin

      - name: Build the container image
        run: |
          cd images && \
          make buildah-build \
            OS_IMAGE=${{ matrix.os_image }} \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images

      - name: Push the container image
        run: |
          cd images && \
          make buildah-push \
            OS_IMAGE=${{ matrix.os_image }} \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images

      - name: Buildah Logout
        if: ${{ always() }}
        run: sudo buildah logout ${{ env.REGISTRY_ADDRESS }}

  build-and-push-rhel8:
    name: Build and Push RHEL 8
    runs-on: arc-runner-set-rhel8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to container registry
        run: |
          echo "${{ env.REGISTRY_PASSWORD }}" | sudo buildah login ${{ env.REGISTRY_ADDRESS }} --username "${{ env.REGISTRY_NAMESPACE }}" --password-stdin

      - name: Build the container image
        run: |
          cd images && \
          make buildah-build-rhel \
            OS_IMAGE=rhel-8 \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images

      - name: Push the container image
        run: |
          cd images && \
          make buildah-push \
            OS_IMAGE=rhel-8 \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images

      - name: Buildah Logout
        if: ${{ always() }}
        run: sudo buildah logout ${{ env.REGISTRY_ADDRESS }}

  build-and-push-rhel9:
    name: Build and Push RHEL 9
    runs-on: arc-runner-set-rhel9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to container registry
        run: |
          echo "${{ env.REGISTRY_PASSWORD }}" | sudo buildah login ${{ env.REGISTRY_ADDRESS }} --username "${{ env.REGISTRY_NAMESPACE }}" --password-stdin

      - name: Build the container image
        run: |
          cd images && \
          make buildah-build-rhel \
            OS_IMAGE=rhel-9 \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images

      - name: Push the container image
        run: |
          cd images && \
          make buildah-push \
            OS_IMAGE=rhel-9 \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images

      - name: Buildah Logout
        if: ${{ always() }}
        run: sudo buildah logout ${{ env.REGISTRY_ADDRESS }}
