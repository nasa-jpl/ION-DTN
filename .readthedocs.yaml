version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - perl
    - cpanminus
  jobs:
    pre_create_environment:
      # Install the required Perl module
      - cpanm --from https://www.cpan.org MIME::Base32@1.303 URI@5.34 Pod::Markdown@3.400
      - chmod +x ./gh-pages/docs/convert-pod-to-md.sh
      - cd ./gh-pages/docs && ./convert-pod-to-md.sh  # Script to convert POD to Markdown
    install:
      - pip install --require-hashes -r readthedocs-requirements.txt

mkdocs:
  configuration: gh-pages/mkdocs.yml  # Path to the mkdocs.yml in the gh-pages directory
