CI/CD:
  - all:
      - changed-files:
          - any-glob-to-any-file:
              - ".github/**"
      - changed-files:
          - all-globs-to-all-files:
              # Exclude source code / build changes (forces full test suite)
              - "!**/*.c"
              - "!**/*.h"
              - "!configure.ac"
              - "!Makefile.am"
              - "!build-bsl-for-ion.sh"
              - "!killm"
              # Exclude genuine test suite subdirectories & demos
              - "!demos/**"
              - "!tests/*/**"

test-mods:
  - all:
      - changed-files:
          - any-glob-to-any-file:
              - "tests/**"
              - "demos/**"
      # Must NOT contain C code / build file changes
      - changed-files:
          - all-globs-to-all-files:
              - "!**/*.c"
              - "!**/*.h"
              - "!configure.ac"
              - "!Makefile.am"
              - "!build-bsl-for-ion.sh"
              - "!killm"
      # Must NOT be test runner / infrastructure files
      - changed-files:
          - all-globs-to-all-files:
              - "!tests/alltests"
              - "!tests/cleanup"
              - "!tests/list_all_tests"
              - "!tests/normaltests"
              - "!tests/quicktests"
              - "!tests/README"
              - "!tests/runcleanup"
              - "!tests/runtests"
              - "!tests/runtestset"
              - "!tests/test_utils.sh"

quick-test:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "tests/cleanup"
              - "tests/runcleanup"
              - "tests/runtests"
              - "tests/test_utils.sh"

documentation:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "site-docs/**"

Infrastructure:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "charts/**"
              - "images/**"

no-test:
  - any:
      - changed-files:
          - any-glob-to-all-files:
              - "{**/*.md,**/*.pod,**/README*,site-docs/**,charts/**,images/**,tests/alltests,tests/normaltests,tests/quicktests,tests/runtestset,.github/labeler.yml}"

AMS:
  - any:
