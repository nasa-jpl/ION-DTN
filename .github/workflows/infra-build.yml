name: Build and Push Runner Images to Registry

permissions:
  contents: read

on:
  push:
    branches: ["integration"]
    paths:
      - "images/**"
      - "charts/arc/Chart.yaml"
  workflow_dispatch:
    inputs:
      runner_u22:
        description: "Build Ubuntu 22.04 (arc-runner-set-u22)"
        required: false
        type: boolean
        default: true
      runner_u24:
        description: "Build Ubuntu 24.04 (arc-runner-set-u24)"
        required: false
        type: boolean
        default: true
      runner_ol8:
        description: "Build Oracle Linux 8 (arc-runner-set-ol8)"
        required: false
        type: boolean
        default: true
      runner_ol9:
        description: "Build Oracle Linux 9 (arc-runner-set-ol9)"
        required: false
        type: boolean
        default: true
      runner_rhel8:
        description: "Build RHEL 8 (arc-runner-set-rhel8)"
        required: false
        type: boolean
        default: true
      runner_rhel9:
        description: "Build RHEL 9 (arc-runner-set-rhel9)"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      runner_u22:
        description: "Build Ubuntu 22.04 (arc-runner-set-u22)"
        required: false
        type: boolean
        default: true
      runner_u24:
        description: "Build Ubuntu 24.04 (arc-runner-set-u24)"
        required: false
        type: boolean
        default: true
      runner_ol8:
        description: "Build Oracle Linux 8 (arc-runner-set-ol8)"
        required: false
        type: boolean
        default: true
      runner_ol9:
        description: "Build Oracle Linux 9 (arc-runner-set-ol9)"
        required: false
        type: boolean
        default: true
      runner_rhel8:
        description: "Build RHEL 8 (arc-runner-set-rhel8)"
        required: false
        type: boolean
        default: true
      runner_rhel9:
        description: "Build RHEL 9 (arc-runner-set-rhel9)"
        required: false
        type: boolean
        default: true

env:
  REGISTRY_ADDRESS: ${{ secrets.REGISTRY_ADDRESS }}
  REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

jobs:
  setup:
    runs-on: arc-runner-set-u22
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build OS Matrix
        id: build-matrix
        run: |
          MATRIX=$(bash .github/scripts/build-runner-matrix.sh \
            --ubuntu_22=${{ github.event_name == 'push' || inputs.runner_u22 }} \
            --ubuntu_24=${{ github.event_name == 'push' || inputs.runner_u24 }} \
            --oracle_linux_8=${{ github.event_name == 'push' || inputs.runner_ol8 }} \
            --oracle_linux_9=${{ github.event_name == 'push' || inputs.runner_ol9 }} \
            --rhel_8=${{ github.event_name == 'push' || inputs.runner_rhel8 }} \
            --rhel_9=${{ github.event_name == 'push' || inputs.runner_rhel9 }})

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build and Push ${{ matrix.runner }}
    needs: setup
    # Evaluates to arc-runner-set-ol8 for u22, u24, ol8, and ol9. Falls back to default for others.
    runs-on: ${{ contains(fromJson('["u22", "u24", "ol8", "ol9"]'), matrix.runner) && 'arc-runner-set-ol8' || format('arc-runner-set-{0}', matrix.runner) }}

    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Login to container registry
        run: |
          echo "${{ env.REGISTRY_PASSWORD }}" | sudo buildah login ${{ env.REGISTRY_ADDRESS }} --username "${{ env.REGISTRY_NAMESPACE }}" --password-stdin

      - name: Set Image Variables
        id: vars
        run: |
          case "${{ matrix.runner }}" in
            u22)   echo "os_image=ubuntu-22" >> $GITHUB_OUTPUT; echo "target=buildah-build" >> $GITHUB_OUTPUT ;;
            u24)   echo "os_image=ubuntu-24" >> $GITHUB_OUTPUT; echo "target=buildah-build" >> $GITHUB_OUTPUT ;;
            ol8)   echo "os_image=oraclelinux-8" >> $GITHUB_OUTPUT; echo "target=buildah-build" >> $GITHUB_OUTPUT ;;
            ol9)   echo "os_image=oraclelinux-9" >> $GITHUB_OUTPUT; echo "target=buildah-build" >> $GITHUB_OUTPUT ;;
            rhel8) echo "os_image=rhel-8" >> $GITHUB_OUTPUT; echo "target=buildah-build-rhel" >> $GITHUB_OUTPUT ;;
            rhel9) echo "os_image=rhel-9" >> $GITHUB_OUTPUT; echo "target=buildah-build-rhel" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build and Push the container image
        run: |
          cd images && \
          sudo make ${{ steps.vars.outputs.target }} \
            OS_IMAGE=${{ steps.vars.outputs.os_image }} \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images && \
          sudo make buildah-push \
            OS_IMAGE=${{ steps.vars.outputs.os_image }} \
            DEFAULT_RUNNER_NAME=${{ env.REGISTRY_ADDRESS }}/${{ env.REGISTRY_NAMESPACE }}/ion-runner-images

      - name: Buildah Logout
        if: ${{ always() }}
        run: sudo buildah logout ${{ env.REGISTRY_ADDRESS }}
