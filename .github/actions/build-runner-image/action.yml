name: "Build and Push Runner Image"
description: "Builds, pushes, generates SBOM, and attaches companion SBOM images for ARC runner images"

inputs:
  runner:
    description: "Target runner identifier (u22, u24, ol8, ol9, rhel8, rhel9)"
    required: true
  build_type:
    description: "Build variant: 'runner' (for standard ARC) or 'base'"
    required: false
    default: "runner"
  registry_address:
    description: "Container registry address"
    required: true
  registry_namespace:
    description: "Container registry namespace"
    required: true
  registry_robot:
    description: "Registry robot / username"
    required: true
  registry_password:
    description: "Registry password"
    required: true
  syft_version:
    description: "Version of Syft for anchore/sbom-action"
    required: false
    # renovate: datasource=github-releases depName=anchore/syft
    default: "v1.45.1"
  sbom_tag_prefix:
    description: "Optional prefix for the image tag in SBOM attach (e.g. 'base-'). Defaults based on build_type."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Login to container registry
      shell: bash
      run: |
        echo "${{ inputs.registry_password }}" | sudo buildah login ${{ inputs.registry_address }} \
          --username "${{ inputs.registry_robot }}" --password-stdin

    - name: Set Image Variables
      id: vars
      shell: bash
      run: |
        case "${{ inputs.runner }}" in
          u22)   OS_IMAGE="ubuntu-22";     IS_RHEL=false ;;
          u24)   OS_IMAGE="ubuntu-24";     IS_RHEL=false ;;
          ol8)   OS_IMAGE="oraclelinux-8"; IS_RHEL=false ;;
          ol9)   OS_IMAGE="oraclelinux-9"; IS_RHEL=false ;;
          rhel8) OS_IMAGE="rhel-8";         IS_RHEL=true ;;
          rhel9) OS_IMAGE="rhel-9";         IS_RHEL=true ;;
          *)
            echo "::error::Unsupported runner target: '${{ inputs.runner }}'"
            exit 1
            ;;
        esac

        if [ "${{ inputs.build_type }}" = "base" ]; then
          TARGET=$([ "$IS_RHEL" = "true" ] && echo "buildah-build-base-rhel" || echo "buildah-build-base")
          DEFAULT_PREFIX="base-"
        else
          TARGET=$([ "$IS_RHEL" = "true" ] && echo "buildah-build-rhel" || echo "buildah-build")
          DEFAULT_PREFIX=""
        fi

        # Allow explicit override; otherwise fall back to type-based prefix
        SBOM_PREFIX="${{ inputs.sbom_tag_prefix }}"
        if [ -z "$SBOM_PREFIX" ] && [ "${{ inputs.build_type }}" = "base" ]; then
          SBOM_PREFIX="$DEFAULT_PREFIX"
        fi

        echo "os_image=$OS_IMAGE" >> $GITHUB_OUTPUT
        echo "target=$TARGET" >> $GITHUB_OUTPUT
        echo "sbom_prefix=$SBOM_PREFIX" >> $GITHUB_OUTPUT

    - name: Build and Push container image
      id: build-push
      shell: bash
      env:
        REPO: ${{ inputs.registry_address }}/${{ inputs.registry_namespace }}/ion-runner-images
      run: |
        set -euo pipefail
        DIGESTFILE="$(sudo mktemp)"

        cd images
        sudo make ${{ steps.vars.outputs.target }} \
          OS_IMAGE=${{ steps.vars.outputs.os_image }} \
          DEFAULT_RUNNER_NAME="$REPO"
        sudo make ${{ inputs.build_type == 'base' && 'buildah-push-base' || 'buildah-push' }} \
          OS_IMAGE=${{ steps.vars.outputs.os_image }} \
          DEFAULT_RUNNER_NAME="$REPO" \
          DIGEST_FILE="$DIGESTFILE"

        echo "digest=$(sudo cat "$DIGESTFILE")" >> "$GITHUB_OUTPUT"
        sudo rm -f "$DIGESTFILE"

        # Reclaim vfs disk and page-cache memory before Syft runs
        sudo buildah rmi --storage-driver=vfs -a -f

    - name: Generate SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      env:
        SYFT_PARALLELISM: "1"
        GOGC: "50"
        SYFT_REGISTRY_AUTH_AUTHORITY: ${{ inputs.registry_address }}
        SYFT_REGISTRY_AUTH_USERNAME: ${{ inputs.registry_robot }}
        SYFT_REGISTRY_AUTH_PASSWORD: ${{ inputs.registry_password }}
      with:
        image: registry:${{ inputs.registry_address }}/${{ inputs.registry_namespace }}/ion-runner-images:${{ steps.vars.outputs.sbom_prefix }}${{ steps.vars.outputs.os_image }}
        output-file: ${{ steps.vars.outputs.os_image }}-sbom.spdx.json
        upload-artifact: false
        syft-version: ${{ inputs.syft_version }}

    - name: Package and Push Private SBOM
      shell: bash
      env:
        REGISTRY_ADDRESS: ${{ inputs.registry_address }}
        REGISTRY_NAMESPACE: ${{ inputs.registry_namespace }}
        OS_IMAGE: ${{ steps.vars.outputs.os_image }}
        SBOM_PREFIX: ${{ steps.vars.outputs.sbom_prefix }}
        DIGEST: ${{ steps.build-push.outputs.digest }}
      run: |
        set -euo pipefail
        REPO="${REGISTRY_ADDRESS}/${REGISTRY_NAMESPACE}/ion-runner-images"
        TAG="${SBOM_PREFIX}${OS_IMAGE}"
        SBOM_FILE="${OS_IMAGE}-sbom.spdx.json"
        ALGO_HASH="${DIGEST#*:}"

        # Build a minimal scratch container holding the SBOM file
        CONTAINER=$(sudo buildah from --storage-driver=vfs scratch)
        sudo buildah copy --storage-driver=vfs "$CONTAINER" "$SBOM_FILE" /sbom.spdx.json

        # Commit with both a tag-matching name and a digest-pinned name.
        # Set the labels on the working container with buildah config: older
        # buildah on some runners rejects --label and --annotation on commit.
        sudo buildah config --storage-driver=vfs \
          --label "org.opencontainers.image.description=SPDX SBOM" \
          --label "org.opencontainers.image.base.name=${REPO}:${TAG}" \
          --label "org.opencontainers.image.base.digest=${DIGEST}" \
          "$CONTAINER"
        sudo buildah commit --storage-driver=vfs "$CONTAINER" "${REPO}:${TAG}.sbom"
        sudo buildah tag --storage-driver=vfs "${REPO}:${TAG}.sbom" "${REPO}:sha256-${ALGO_HASH}.sbom"
        sudo buildah rm --storage-driver=vfs "$CONTAINER"

        # Push using the existing root-authenticated buildah session
        sudo buildah push --storage-driver=vfs "${REPO}:${TAG}.sbom"
        sudo buildah push --storage-driver=vfs "${REPO}:sha256-${ALGO_HASH}.sbom"

    - name: Buildah Logout
      if: ${{ always() }}
      shell: bash
      run: sudo buildah logout ${{ inputs.registry_address }}
