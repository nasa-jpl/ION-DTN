name: RTEMS 6.1 ARM64 Build and Test (libbsd)

permissions:
  contents: read
  statuses: write
  pull-requests: read

on:
  workflow_call:
    inputs:
      pr_number:
        description: "The PR number this test is associated with."
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Timeout for build and tests in minutes (default: 30 minutes)"
        required: false
        type: number
        default: 30

  workflow_dispatch:
    inputs:
      pr_number:
        description: "The PR number this test is associated with."
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Timeout for build and tests in minutes (default: 30 minutes)"
        required: false
        type: number
        default: 30

  push:
    branches:
      - update-4.1.5-rtems
      - integration
    paths:
      - "arch-rtems/**"
      - "ici/**"
      - "ltp/**"
      - "bpv7/**"
      - ".github/workflows/ci-rtems61-aarch64-libbsd.yml"

  pull_request:
    paths:
      - "arch-rtems/**"
      - "ici/**"
      - "ltp/**"
      - "bpv7/**"
      - ".github/workflows/ci-rtems61-aarch64-libbsd.yml"

  merge_group:
    branches:
      - integration

jobs:
  rtems-build-and-test:
    runs-on: [self-hosted, karuna]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize required submodules
        run: |
          # Only initialize rtems_waf submodule (required for build)
          git submodule sync contrib/rtems_waf
          git submodule update --init --force contrib/rtems_waf

          # Verify submodule was initialized
          echo "Checking rtems_waf submodule contents:"
          ls -la contrib/rtems_waf/

          # Verify the actual Python files are present
          if [ -f "contrib/rtems_waf/rtems.py" ]; then
            echo "✓ rtems_waf submodule properly initialized"
          else
            echo "✗ rtems_waf submodule initialization failed - missing files"
            exit 1
          fi

      - name: Display runner information
        run: |
          echo "Runner: ${{ runner.name }}"
          echo "OS: $(cat /etc/os-release | grep PRETTY_NAME)"
          echo "Arch: $(uname -m)"
          echo "User: $(whoami)"
          echo "Docker version: $(docker --version)"
          echo "Available Docker images:"
          docker images | grep rtems || echo "No RTEMS images found"

      - name: Generate timestamp for artifacts
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create output directory
        run: |
          mkdir -p rtems-test-output
          chmod 777 rtems-test-output

      - name: Cache RTEMS build artifacts
        id: cache-rtems-build
        uses: actions/cache@v5
        with:
          path: arch-rtems/build
          key: rtems-build-${{ hashFiles('arch-rtems/**', 'ici/**', 'ltp/**', 'bpv7/**') }}

      - name: Build ION in RTEMS Docker container
        id: build
        if: steps.cache-rtems-build.outputs.cache-hit != 'true'
        timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '30') }}
        run: |
          echo "Starting RTEMS 6.1 ARM64 build at $(date)"

          # Launch Docker container with ION source mounted
          CONTAINER_ID=$(docker run -d \
            --name rtems-ion-build-${{ github.run_id }} \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/arch-rtems \
            rtems-6.1-dev-aarch64-libbsd \
            sleep infinity)

          echo "Container ID: $CONTAINER_ID"
          echo "CONTAINER_ID=$CONTAINER_ID" >> $GITHUB_OUTPUT

          # Wait for container to be ready
          sleep 2

          # Verify rtems_waf is available inside container
          echo "Checking rtems_waf inside container:"
          docker exec $CONTAINER_ID bash -c "ls -la /workspace/contrib/rtems_waf/ || echo 'rtems_waf not found'"
          docker exec $CONTAINER_ID bash -c "ls -la /workspace/arch-rtems/rtems_waf || echo 'symlink not found'"

          # Clean previous build if any
          docker exec $CONTAINER_ID bash -c "cd /workspace/arch-rtems && ./waf clean || true"

          # Configure and build
          docker exec $CONTAINER_ID bash -c "cd /workspace/arch-rtems && ./waf configure --rtems=/opt/rtems/6 --rtems-bsp=aarch64/a53_lp64_qemu"

          docker exec $CONTAINER_ID bash -c "cd /workspace/arch-rtems && ./waf build" 2>&1 | tee rtems-test-output/build-log.txt

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Build failed with status $BUILD_STATUS"
            echo "BUILD_FAILED=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "Build completed successfully"
          echo "BUILD_FAILED=false" >> $GITHUB_OUTPUT

      - name: Run ION in QEMU
        id: test
        timeout-minutes: 2
        run: |
          echo "Starting QEMU test at $(date)"

          # Launch container for QEMU verification (works with both fresh build and cached build)
          TEST_CONTAINER_ID=$(docker run -d \
            --name rtems-ion-test-${{ github.run_id }} \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/arch-rtems \
            rtems-6.1-dev-aarch64-libbsd \
            sleep infinity)

          echo "Test container ID: $TEST_CONTAINER_ID"

          # Run ION in QEMU and capture output
          docker exec $TEST_CONTAINER_ID bash -c \
            "cd /workspace/arch-rtems && \
             timeout 60 qemu-system-aarch64 \
               -no-reboot \
               -nographic \
               -serial mon:stdio \
               -machine virt,gic-version=3 \
               -cpu cortex-a53 \
               -m 4096 \
               -kernel build/aarch64-rtems6-a53_lp64_qemu/ion.exe" \
            2>&1 | tee rtems-test-output/qemu-output.txt

          QEMU_STATUS=${PIPESTATUS[0]}

          # Stop and remove test container
          docker stop $TEST_CONTAINER_ID || true
          docker rm $TEST_CONTAINER_ID || true

          # QEMU will be terminated by timeout, so exit code 124 is expected
          if [ $QEMU_STATUS -eq 124 ] || [ $QEMU_STATUS -eq 0 ]; then
            echo "QEMU test completed (exit code: $QEMU_STATUS)"
          else
            echo "QEMU test failed with unexpected exit code: $QEMU_STATUS"
            echo "TEST_FAILED=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "TEST_FAILED=false" >> $GITHUB_OUTPUT

      - name: Verify test results
        id: verify
        if: ${{ steps.build.outputs.build_failed != 'true' && steps.test.outputs.test_failed != 'true' }}
        run: .github/scripts/rtems-verify-qemu-output.sh --qemu-output=rtems-test-output/qemu-output.txt --report-output=rtems-test-output/verification-report.txt

      - name: Create test summary
        if: always()
        run: |
          cat > rtems-test-output/test-summary.txt << EOF
          RTEMS 6.1 ARM64 ION Test Summary
          ================================
          Date: $(date)
          Workflow Run: ${{ github.run_id }}
          PR Number: ${{ inputs.pr_number }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          Build Status: $([ "${{ steps.build.outputs.build_failed }}" = "true" ] && echo "FAILED" || echo "SUCCESS")
          Test Status: $([ "${{ steps.test.outputs.test_failed }}" = "true" ] && echo "FAILED" || echo "SUCCESS")
          Verification Status: $([ "${{ steps.verify.outputs.verification_failed }}" = "true" ] && echo "FAILED" || echo "SUCCESS")

          Runner: ${{ runner.name }}
          Docker Image: rtems-6.1-dev-aarch64-libbsd

          Artifacts:
          - build-log.txt: Complete build output
          - qemu-output.txt: QEMU execution output
          - test-summary.txt: This summary file
          EOF

          cat rtems-test-output/test-summary.txt

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rtems-test-results-${{ steps.timestamp.outputs.timestamp }}
          path: rtems-test-output/
          if-no-files-found: warn

      - name: Stop and remove Docker containers
        if: always()
        run: |
          # Clean up both build and test containers (if they exist)
          echo "Cleaning up containers for run ${{ github.run_id }}"
          docker ps -a --filter "name=rtems-ion-build-${{ github.run_id }}" --format "{{.ID}}" | xargs -r docker stop || true
          docker ps -a --filter "name=rtems-ion-build-${{ github.run_id }}" --format "{{.ID}}" | xargs -r docker rm || true
          docker ps -a --filter "name=rtems-ion-test-${{ github.run_id }}" --format "{{.ID}}" | xargs -r docker stop || true
          docker ps -a --filter "name=rtems-ion-test-${{ github.run_id }}" --format "{{.ID}}" | xargs -r docker rm || true

      - name: Clean up workspace
        if: always()
        run: |
          # Clean waf lock files but preserve build/ (cached by GitHub Actions)
          cd ${{ github.workspace }}/arch-rtems
          ./waf clean || true
          rm -rf .lock-waf* .waf-* .waf3-* || true

      - name: Report test results
        if: always()
        run: |
          if [ "${{ steps.build.outputs.build_failed }}" = "true" ]; then
            echo "::error::RTEMS build failed"
            exit 1
          elif [ "${{ steps.test.outputs.test_failed }}" = "true" ]; then
            echo "::error::RTEMS QEMU test failed"
            exit 1
          elif [ "${{ steps.verify.outputs.verification_failed }}" = "true" ]; then
            echo "::error::RTEMS test verification failed"
            exit 1
          else
            echo "::notice::RTEMS 6.1 ARM64 build and test passed successfully"
          fi

      - name: Set PR status
        if: ${{ always() && inputs.pr_number != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const conclusion = "${{ job.status }}" === "success" ? "success" : "failure";
            const prNumber = parseInt("${{ inputs.pr_number }}", 10);

            let pr;
            try {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              pr = data;
            } catch (error) {
              console.log(`PR #${prNumber} not found: ${error.message}`);
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: pr.head.sha,
              state: conclusion,
              context: "ci/rtems61-aarch64-libbsd",
              description: `RTEMS 6.1 ARM64 build and test ${conclusion === "success" ? "passed" : "failed"}`,
              target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            });
