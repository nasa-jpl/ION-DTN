---
- name: Validate secrets file exists
  ansible.builtin.stat:
    path: "{{ charts_path }}/arc/secrets.local.yaml"
  register: secrets_file

- name: Fail if secrets file is missing
  ansible.builtin.fail:
    msg: "Required secrets file arc/secrets.local.yaml not found"
  when: not secrets_file.stat.exists

- name: Load local secrets into Ansible runtime
  ansible.builtin.include_vars:
    file: "{{ charts_path }}/arc/secrets.local.yaml"
    name: arc_secrets
  when: config == 'rtems'

- name: Check Kubernetes cluster accessibility
  kubernetes.core.k8s_info:
    kind: Node
  register: k8s_nodes
  ignore_errors: true

- name: Fail if Kubernetes cluster is not accessible
  ansible.builtin.fail:
    msg: "Kubernetes cluster is not accessible. Ensure cluster is running and configured properly."
  when: k8s_nodes is failed

- name: Generate values.yaml from template
  ansible.builtin.template:
    src: "templates/values.yaml.j2"
    dest: "{{ charts_path }}/arc/values.yaml"
    mode: "0644"

- name: Display values.yaml generation result
  ansible.builtin.debug:
    msg: "✓ values.yaml generated successfully for {{ config }} configuration"

- name: Add all required Helm repositories
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.repo_url }}"
  loop:
    - name: headlamp
      repo_url: "https://kubernetes-sigs.github.io/headlamp/"
    - name: metrics-server
      repo_url: "https://kubernetes-sigs.github.io/metrics-server/"
    - name: prometheus
      repo_url: "https://prometheus-community.github.io/helm-charts"
    - name: mogenius
      repo_url: "https://helm.mogenius.com/public"
      install_repo: "{{ config == 'rtems' }}"
  when: item.install_repo | default(true) | bool

- name: Deploy Headlamp Helm chart
  kubernetes.core.helm:
    name: headlamp
    chart_ref: headlamp/headlamp
    release_namespace: kube-system
    wait: true
    release_values:
      service:
        type: NodePort
        nodePort: 32000
  register: headlamp_result

- name: Check if Headlamp deployment failed
  ansible.builtin.fail:
    msg: "❌ Headlamp deployment failed: {{ headlamp_result.stderr | default('Unknown error') }}"
  when: headlamp_result.failed | default(false)

- name: Display Headlamp deployment result
  ansible.builtin.debug:
    msg: >-
      ✓ Headlamp deployed successfully to the headlamp namespace.
      Status: {{ 'Created' if headlamp_result.status is defined and headlamp_result.status == 201 else 'Updated' }}

- name: Deploy metrics-server Helm chart
  kubernetes.core.helm:
    name: metrics-server
    chart_ref: metrics-server/metrics-server
    release_namespace: kube-system
    wait: true
    release_values:
      args:
        - "--kubelet-insecure-tls"
  register: metrics_result

- name: Display metrics-server deployment result
  ansible.builtin.debug:
    msg: >-
      ✓ metrics-server deployed successfully to the kube-system namespace.
      Status: {{ 'Created' if metrics_result.status is defined and metrics_result.status == 201 else 'Updated' }}

- name: Create Headlamp admin ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: headlamp-admin
        namespace: kube-system

- name: Create ClusterRoleBinding for Headlamp admin
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: headlamp-admin-binding
      subjects:
        - kind: ServiceAccount
          name: headlamp-admin
          namespace: kube-system
      roleRef:
        kind: ClusterRole
        name: cluster-admin
        apiGroup: rbac.authorization.k8s.io

- name: Create long-lived token Secret for Headlamp admin
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: headlamp-admin-token
        namespace: kube-system
        annotations:
          kubernetes.io/service-account.name: headlamp-admin
      type: kubernetes.io/service-account-token

- name: Fetch the populated token Secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: headlamp-admin-token
    namespace: kube-system
  register: headlamp_secret
  until: >
    headlamp_secret.resources | length > 0 and
    headlamp_secret.resources[0].data is defined and
    headlamp_secret.resources[0].data.token is defined
  retries: 5
  delay: 2

- name: Record Headlamp token in ARA
  ara_record:
    key: "headlamp_admin_token"
    value: "{{ headlamp_secret.resources[0].data.token | b64decode }}"
    type: text

- name: Install Prometheus Chart
  kubernetes.core.helm:
    name: prometheus
    chart_ref: prometheus/kube-prometheus-stack
    create_namespace: true
    release_namespace: monitoring
    wait: true
    release_values:
      grafana:
        service:
          type: NodePort
          nodePort: 32300

- name: Fetch Grafana admin password Secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: prometheus-grafana
    namespace: monitoring
  register: grafana_secret
  until: >
    grafana_secret.resources | length > 0 and
    grafana_secret.resources[0].data is defined and
    grafana_secret.resources[0].data['admin-password'] is defined
  retries: 5
  delay: 2

- name: Record Grafana admin password in ARA
  ara_record:
    key: "grafana_admin_password"
    value: "{{ grafana_secret.resources[0].data['admin-password'] | b64decode }}"
    type: text

- name: Import ARC Dashboard to Grafana via ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: arc-grafana-dashboard
        namespace: monitoring
        labels:
          grafana_dashboard: "1"
      data:
        arc-dashboard.json: "{{ lookup('file', 'dashboard.json') }}"

- name: Create renovate-operator namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: renovate-operator
  when: config == 'rtems'

- name: Deploy Renovate ConfigMap natively via Ansible
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: renovate-config
        namespace: renovate-operator
      data:
        config.json: "{{ lookup('file', 'renovate-config.json') }}"
  when: config == 'rtems'

- name: Deploy Renovate Operator Helm chart
  kubernetes.core.helm:
    name: renovate-operator
    chart_ref: mogenius/renovate-operator
    release_namespace: renovate-operator
    create_namespace: true
    wait: true
    release_values:
      valkey:
        enabled: true
        auth:
          enabled: false
      config:
        logStorage:
          mode: valkey
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
        dashboard:
          enabled: true
          namespace: monitoring
      extraManifests:
        - |
          apiVersion: v1
          kind: Secret
          metadata:
            name: renovate-env
            namespace: renovate-operator
          type: Opaque
          stringData:
            RENOVATE_TOKEN: "{{ arc_secrets.githubToken }}"
        - |
          apiVersion: v1
          kind: Service
          metadata:
            name: renovate-operator-ui-nodeport
            namespace: renovate-operator
          spec:
            type: NodePort
            ports:
              - port: 8081
                targetPort: 8081
                nodePort: 32050
                protocol: TCP
            selector:
              app: renovate-operator-renovate-operator
  no_log: true
  when: config == 'rtems'

- name: Deploy RenovateJob Custom Resource
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: renovate-operator.mogenius.com/v1alpha1
      kind: RenovateJob
      metadata:
        name: renovate-job
        namespace: renovate-operator
      spec:
        schedule: "@hourly"
        parallelism: 1
        discoveryFilters:
          - "{{ arc_secrets.renovateTargetRepo }}"
        provider:
          name: github
        secretRef: renovate-env
        image: "renovate/renovate:{{ renovate_version | default('latest') }}"
        extraVolumes:
          - name: config-volume
            configMap:
              name: renovate-config
        extraVolumeMounts:
          - name: config-volume
            mountPath: /usr/src/app/config.json
            subPath: config.json
        extraEnv:
          - name: RENOVATE_CONFIG_FILE
            value: /usr/src/app/config.json
  when: config == 'rtems'

- name: Display Renovate Operator deployment result
  ansible.builtin.debug:
    msg: "✓ Renovate Operator and RenovateJob deployed successfully to the renovate-operator namespace."
  when: config == 'rtems'

- name: Deploy ARC Helm chart
  kubernetes.core.helm:
    name: arc
    chart_ref: "{{ charts_path }}/arc"
    release_namespace: arc-systems
    create_namespace: true
    wait: true
    values_files:
      - "{{ charts_path }}/arc/secrets.local.yaml"
  register: helm_result

- name: Create PodMonitor for ARC Controller
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: arc-controller-monitor
        namespace: arc-systems
        labels:
          release: prometheus
      spec:
        namespaceSelector:
          matchNames:
            - arc-systems
        selector:
          matchLabels:
            app.kubernetes.io/name: gha-rs
        podMetricsEndpoints:
          - path: /metrics
            targetPort: 8081

- name: Create PodMonitor for ARC Listeners
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: arc-listener-monitor
        namespace: arc-systems
        labels:
          release: prometheus
      spec:
        namespaceSelector:
          matchNames:
            - arc-systems
        selector:
          matchLabels:
            arc-metrics: "scrape"
        podMetricsEndpoints:
          - path: /metrics
            targetPort: 8081

- name: Display Helm deployment result
  ansible.builtin.debug:
    msg: >-
      ✓ Helm chart deployed successfully to arc-systems namespace.
      Status: {{ 'Created' if helm_result.status is defined and helm_result.status == 201 else 'Updated' }}
      {{ 'Release name: ' + helm_result.release_name if helm_result.release_name is defined else '' }}
      {{ 'Revision: ' + helm_result.release_revision | string if helm_result.release_revision is defined else '' }}
