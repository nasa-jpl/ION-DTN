name: Regression Tests for ION on RHEL8

on:
  workflow_call:
    inputs:
      tests_to_run:
        description: 'Space-separated list of tests to run (e.g., "test1 test2"). Leave blank to run all.'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'The PR number this test is associated with.'
        required: false
        type: string

  workflow_dispatch:
    inputs:
      tests_to_run:
        description: 'Space-separated list of tests to run (e.g., "test1 test2"). Leave blank to run all.'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'The PR number this test is associated with.'
        required: false
        type: string
        default: ''

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64, rhel8podman]
    steps:
      - name: Clean up workspace
        run: |
          rm -rf $GITHUB_WORKSPACE/*

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display OS and Arch
        run: |
          cat /etc/os-release
          echo "Arch:"
          uname -m
          echo "User ID:"
          id
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

      - name: Generate timestamp for file names
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Run build and tests, capture stdout
        run: |
          {
            echo "Starting build and tests at $(date)"
            export USER=$(whoami)
            echo "USER is set to: $USER"
            export ION_RUN_EXPERT="yes"
            export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
            autoreconf -fi
            ./configure --enable-crypto-mbedtls --enable-bpsec-debugging
            make -j4
            sudo make install
            make buildcheck
            sudo ldconfig
            cd tests
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tests_to_run }}" ]; then
              echo "Running specific tests: ${{ github.event.inputs.tests_to_run }}"
              ./runtests ${{ github.event.inputs.tests_to_run }}
            else
              echo "Running all tests"
              ./runtests
            fi
          } > build-and-test.log 2>&1

      - name: Display Progress
        if: ${{ always() }}
        run: |
          cat ./tests/progress | grep "FAILED" || { printf "No failed tests.\n"; exit 0; }

      - name: Upload full build and test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-log-rhel8-${{ env.TIMESTAMP }}
          path: build-and-test.log

      - name: Upload progress file as artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-progress-rhel8-${{ env.TIMESTAMP }}
          path: ./tests/progress

      - name: Clean up ION build
        if: ${{ always() }}
        run: |
          sudo make uninstall
          make clean
          make distclean
          rm -rf $GITHUB_WORKSPACE/*

          - name: Set PR status
          if: ${{ github.event.inputs.pr_number != '' }}
          uses: actions/github-script@v7
          with:
            script: |
              const conclusion = "${{ job.status }}" === "success" ? "success" : "failure";
              const prNumber = parseInt("${{ github.event.inputs.pr_number }}", 10);
        
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
              });
        
              const pr = pulls.find(p => p.number === prNumber);
              if (!pr) {
                console.log("PR not found");
                return;
              }
        
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: conclusion,
                context: "${{ github.workflow }} - ${{ runner.os }}",
                description: `Tests ${conclusion === "success" ? "passed" : "failed"}`,
                target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              });