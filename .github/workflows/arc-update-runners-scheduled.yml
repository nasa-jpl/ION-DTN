name: Runner Updates Check (Scheduled Job)

permissions:
  pull-requests: write
  contents: write

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  check-and-update-versions:
    runs-on: arc-runner-set-u22
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check and apply version updates
        id: versions
        run: |
          # Extract current versions from Makefile (handles "VAR ?= value" format)
          # 1. Docker
          DOCKER_CURRENT=$(grep -oP '(?<=DOCKER_VERSION \?= )[0-9.]+' images/Makefile | head -1)
          DOCKER_CURRENT=${DOCKER_CURRENT:-0.0.0}
          DOCKER_LATEST=$(curl -s https://download.docker.com/linux/static/stable/x86_64/ | grep -oP 'docker-\K[0-9]+\.[0-9]+\.[0-9]+(?=\.tgz)' | sort -V | tail -n 1)

          # 2. Docker Compose (Pinned to v2.x.x, Makefile stores with 'v' prefix)
          COMPOSE_CURRENT=$(grep -oP '(?<=DOCKER_COMPOSE_VERSION \?= )v?[0-9.]+' images/Makefile | head -1)
          COMPOSE_CURRENT=${COMPOSE_CURRENT:-0.0.0}
          COMPOSE_LATEST=$(gh api repos/docker/compose/releases --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | grep -oP 'v2\.[0-9]+\.[0-9]+' | head -1)

          # 3. Actions Runner
          RUNNER_CURRENT=$(grep -oP '(?<=RUNNER_VERSION \?= )[0-9.]+' images/Makefile | head -1)
          RUNNER_CURRENT=${RUNNER_CURRENT:-0.0.0}
          RUNNER_LATEST=$(gh api repos/actions/runner/releases --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | grep -oP '(?<=v)[0-9.]+' | head -1)

          # 4. Container Hooks
          HOOKS_CURRENT=$(grep -oP '(?<=RUNNER_CONTAINER_HOOKS_VERSION \?= )[0-9.]+' images/Makefile | head -1)
          HOOKS_CURRENT=${HOOKS_CURRENT:-0.0.0}
          HOOKS_LATEST=$(gh api repos/actions/runner-container-hooks/releases --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | grep -oP '(?<=v)[0-9.]+' | head -1)

          # Determine if any updates are needed and build commit message
          SHOULD_UPDATE=0
          COMMIT_MSG="Update"

          # Use sed with line-anchored patterns to only update variable definitions (not usages)
          if [ "$DOCKER_CURRENT" != "$DOCKER_LATEST" ] && [ -n "$DOCKER_LATEST" ] && [ "$DOCKER_CURRENT" != "0.0.0" ]; then
            SHOULD_UPDATE=1
            COMMIT_MSG="$COMMIT_MSG Docker to v$DOCKER_LATEST,"
            sed -i "s/^DOCKER_VERSION ?= $DOCKER_CURRENT$/DOCKER_VERSION ?= $DOCKER_LATEST/" images/Makefile
          fi

          if [ "$COMPOSE_CURRENT" != "$COMPOSE_LATEST" ] && [ -n "$COMPOSE_LATEST" ] && [ "$COMPOSE_CURRENT" != "0.0.0" ]; then
            SHOULD_UPDATE=1
            COMMIT_MSG="$COMMIT_MSG Docker Compose to $COMPOSE_LATEST,"
            sed -i "s/^DOCKER_COMPOSE_VERSION ?= $COMPOSE_CURRENT$/DOCKER_COMPOSE_VERSION ?= $COMPOSE_LATEST/" images/Makefile
          fi

          if [ "$RUNNER_CURRENT" != "$RUNNER_LATEST" ] && [ -n "$RUNNER_LATEST" ] && [ "$RUNNER_CURRENT" != "0.0.0" ]; then
            SHOULD_UPDATE=1
            COMMIT_MSG="$COMMIT_MSG Runner to v$RUNNER_LATEST,"
            sed -i "s/^RUNNER_VERSION ?= $RUNNER_CURRENT$/RUNNER_VERSION ?= $RUNNER_LATEST/" images/Makefile
          fi

          if [ "$HOOKS_CURRENT" != "$HOOKS_LATEST" ] && [ -n "$HOOKS_LATEST" ] && [ "$HOOKS_CURRENT" != "0.0.0" ]; then
            SHOULD_UPDATE=1
            COMMIT_MSG="$COMMIT_MSG Container Hooks to v$HOOKS_LATEST,"
            sed -i "s/^RUNNER_CONTAINER_HOOKS_VERSION ?= $HOOKS_CURRENT$/RUNNER_CONTAINER_HOOKS_VERSION ?= $HOOKS_LATEST/" images/Makefile
          fi

          # Clean up trailing comma from the commit message
          COMMIT_MSG=$(echo "$COMMIT_MSG" | sed 's/,$//')

          # Output to GitHub Actions environment
          echo "should_update=$SHOULD_UPDATE" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.versions.outputs.should_update == '1'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: Bump runner dependency version
          title: "Automated dependencies update generated by GitHub Actions."
          body: ${{ steps.versions.outputs.commit_msg }}
          branch: update-runner-deps
          add-paths: images/Makefile
          base: integration
          branch-suffix: timestamp
