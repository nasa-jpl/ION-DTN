# Monthly Duration Sync Workflow - Parallelized
#
# Architecture: 4-job parallel pipeline
#   1. Setup: Generate test matrix, calculate cache keys, create timestamp
#   2. Build: Compile ION once, cache workspace for all benchmark jobs
#   3. Benchmark (matrix): Run benchmark.py in parallel across 7 batches
#   4. Aggregate: Merge .DURATION files, create PR if changes detected
#
# Workflow Structure:
#   - Filters optional tests at matrix generation (Phase 1: --exclude-optional)
#   - Hash-based caching invalidates only on source code changes (Phase 4)
#   - Parallel benchmark execution across 7 runners (default, Phase 5)
#   - Artifacts merged via merge-duration-artifacts.sh (Phase 2, Phase 6)
#
# Testing Requirements:
#   ⚠️  CRITICAL: Workflow testing MUST be done interactively with human operator
#   - No autonomous agent testing of GitHub Actions workflows
#   - Manual workflow_dispatch trigger required for validation
#   - Verify parallel execution, caching, artifact merge, PR creation
#
# Inputs (workflow_dispatch):
#   - reason: Description for manual trigger
#
# Outputs:
#   - PR to integration branch (if .DURATION files changed)
#   - Artifacts: combined sync log, per-batch benchmark logs
#
# Rollout Checklist:
#   - [ ] Phase 1-6 implementation complete
#   - [ ] Manual test with small test subset (2-3 batches)
#   - [ ] Manual test with full test suite (7 batches)
#   - [ ] Verify cache hit behavior on repeat runs
#   - [ ] Verify PR creation with changes
#   - [ ] Verify no PR when no changes
#   - [ ] Confirm workflow completes within 7-hour timeout
#   - [ ] Schedule enabled for monthly execution (1st @ 8:00 UTC)

# Requirements:
# - Repository has 'contents: write' and 'pull-requests: write' permissions
# - Workflow is configured to run on a schedule (1st of every month at 8:00 UTC)
# - Workflow can be manually triggered via the 'Reason for manual trigger' input

name: Monthly Duration Sync

on:
  schedule:
    # Run at 8:00 AM UTC on the 1st of every month
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        type: string
        default: "Manual duration sync"
      test_subset:
        description: "Test subset for validation (empty = all tests)"
        required: false
        type: string
        default: ""
      num_runners:
        description: "Number of parallel benchmark batches (default: 7)"
        required: false
        type: number
        default: 7

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-duration-sync
  cancel-in-progress: false

jobs:
  setup:
    runs-on: arc-runner-set-u22
    outputs:
      testmatrix: ${{ steps.map-matrix.outputs.matrix }}
      timestamp: ${{ steps.generate-timestamp.outputs.timestamp }}
      src_hash: ${{ steps.calculate-hash.outputs.hash }}
      num_batches: ${{ steps.map-matrix.outputs.count }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Calculate Source Hash
        id: calculate-hash
        run: echo "hash=${{ hashFiles('**/*.c', '**/*.h', 'configure.ac', 'Makefile.am') }}" >> $GITHUB_OUTPUT

      - name: Get test batches
        id: map-matrix
        uses: ./.github/actions/generate-test-matrix
        with:
          tests_to_run: ${{ inputs.test_subset || '' }}
          num_runners: ${{ inputs.num_runners || 7 }}
          is_solaris: "false"
          exclude_optional: "true"

      - name: Generate timestamp for artifacts
        id: generate-timestamp
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Generated timestamp: $TIMESTAMP"

      - name: Validate test matrix not empty
        run: |
          if [ "${{ steps.map-matrix.outputs.count }}" == "0" ]; then
            echo "::error::No tests to run after filtering optional tests"
            exit 1
          fi
          echo "Test matrix generated with ${{ steps.map-matrix.outputs.count }} batches"

  build:
    needs: setup
    runs-on: arc-runner-set-u22
    env:
      REASON: ${{ inputs.reason }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Restore Build Workspace Cache
        id: cache-build-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            .
            !.git
            !autom4te.cache/
            !.github/
            !compile-and-buildcheck.log
            !**/*.md
          # Primary key is globally unique to prevent save collisions
          key: ion-build-arc-runner-set-u22-${{ needs.setup.outputs.src_hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Fallback looks for any previous cache sharing this exact source code hash
          restore-keys: |
            ion-build-arc-runner-set-u22-${{ needs.setup.outputs.src_hash }}-

      - name: Build ION and Run Buildcheck
        if: ${{ steps.cache-build-restore.outputs.cache-matched-key == '' }}
        timeout-minutes: 90
        env:
          EXTRA_CONFIGURE_FLAGS: "CFLAGS=-DHAVE_VALGRIND_VALGRIND_H"
        run: |
          ./.github/scripts/compile-and-buildcheck.sh > compile-and-buildcheck.log 2>&1 || {
            BUILD_STATUS=$?
            echo "Build or buildcheck failed with status $BUILD_STATUS" >&2
            exit $BUILD_STATUS
          }

      - name: Upload build and buildcheck logs
        if: ${{ always() && steps.cache-build-restore.outputs.cache-matched-key == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: compile-and-buildcheck-log-arc-runner-set-u22-${{ needs.setup.outputs.timestamp }}
          path: compile-and-buildcheck.log
          if-no-files-found: warn

      - name: Save Build Workspace Cache
        if: ${{ success() && steps.cache-build-restore.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .
            !.git
            !autom4te.cache/
            !.github/
            !compile-and-buildcheck.log
            !**/*.md
          key: ion-build-arc-runner-set-u22-${{ needs.setup.outputs.src_hash }}-${{ github.run_id }}-${{ github.run_attempt }}

  benchmark:
    needs: [setup, build]
    strategy:
      fail-fast: false
      matrix:
        test_batch: ${{ fromJSON(needs.setup.outputs.testmatrix) }}
    runs-on: arc-runner-set-u22
    timeout-minutes: 420

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Restore Build Workspace Cache
        uses: actions/cache/restore@v5
        id: cache-restore
        with:
          path: |
            .
            !.git
            !autom4te.cache/
            !.github/
            !compile-and-buildcheck.log
            !**/*.md
          key: ion-build-arc-runner-set-u22-${{ needs.setup.outputs.src_hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ion-build-arc-runner-set-u22-${{ needs.setup.outputs.src_hash }}-

      - name: Overlay fresh tests and scripts
        if: ${{ steps.cache-restore.outputs.cache-matched-key != '' }}
        run: git restore tests/ demos/ killm .github/

      - name: Install ION
        if: ${{ steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          echo "Starting installation at $(date)"
          sudo make install
          sudo ldconfig

      - name: Run benchmark on test batch
        timeout-minutes: 420
        run: |
          .github/scripts/run-benchmark-batch.sh \
            ${{ matrix.test_batch.batch }} \
            ${{ join(matrix.test_batch.tests, ' ') }} \
            2>&1 | tee benchmark-batch-${{ matrix.test_batch.batch }}.log

      - name: Filter and stage changed .DURATION files
        id: stage-durations
        run: .github/scripts/filter-duration.sh --threshold 30 --output-dir duration-staging/

      - name: Upload .DURATION files for this batch
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: duration-files-arc-runner-set-u22-${{ needs.setup.outputs.timestamp }}-batch-${{ matrix.test_batch.batch }}
          include-hidden-files: true
          path: duration-staging/
          if-no-files-found: warn

      - name: Bundle log files
        if: ${{ always() }}
        run: |
          mkdir -p logs-bundle

          cp benchmark-batch-${{ matrix.test_batch.batch }}.log logs-bundle/ 2>/dev/null || echo "No benchmark log found"

          # Copy .stdout files, preserving the directory structure
          find tests demos -name "*.stdout" -type f -exec cp --parents {} logs-bundle/ \; 2>/dev/null || echo "No .stdout files found"

          echo "Log bundle contents:"
          find logs-bundle -type f

      - name: Upload bundled logs for this batch
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-logs-bundle-arc-runner-set-u22-${{ needs.setup.outputs.timestamp }}-batch-${{ matrix.test_batch.batch }}
          path: logs-bundle/
          if-no-files-found: warn

  aggregate-results:
    name: "Merge Duration Files and Create PR"
    needs: [setup, build, benchmark]
    runs-on: arc-runner-set-u22
    env:
      REASON: ${{ inputs.reason }}
    if: ${{ always() }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Download all duration file artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: duration-files-*
          path: artifacts-staging/

      - name: Merge duration files into working tree
        run: |
          # Create a clean directory to safely check for actual batch overlaps
          mkdir -p clean-merge-target

          # Merge into the clean target instead of '.'
          .github/scripts/merge-duration-artifacts.sh artifacts-staging/ clean-merge-target || {
            MERGE_STATUS=$?
            if [ "$MERGE_STATUS" -eq 1 ]; then
              echo "No duration files changed"
              exit 0
            else
              echo "::error::Merge failed with status $MERGE_STATUS"
              exit $MERGE_STATUS
            fi
          }

          # Copy the validated, merged files over the Git working tree
          cp -a clean-merge-target/. .

      - name: Check for changes
        id: changes
        run: |
          rm -rf clean-merge-target/
          rm -rf artifacts-staging/
          if git diff --quiet tests/ demos/; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No .DURATION files were modified"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in .DURATION files"
            git diff --stat tests/ demos/
          fi

      - name: Download all log bundle artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: benchmark-logs-bundle-*
          path: artifacts-staging/

      - name: Upload combined sync log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: monthly-duration-sync-log-${{ needs.setup.outputs.timestamp }}
          path: |
            artifacts-staging/**/benchmark-*.log
            artifacts-staging/**/*.stdout
            artifacts-staging/**/compile-and-buildcheck-log-*
          if-no-files-found: warn

      - name: Create Pull Request
        if: steps.changes.outputs.changes == 'true' && needs.benchmark.result == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: integration
          commit-message: "chore: monthly .DURATION file sync - ${{ needs.setup.outputs.timestamp }}"
          branch: monthly-duration-sync-${{ needs.setup.outputs.timestamp }}
          delete-branch: true
          title: "Monthly .DURATION File Sync - ${{ needs.setup.outputs.timestamp }}"
          body: |
            ## Monthly .DURATION File Synchronization

            This PR contains the monthly regeneration of all `.DURATION` files for ION tests and demos.

            **Triggered:** ${{ github.event_name == 'schedule' && 'Automated monthly cron' || format('Manual trigger: {0}', env.REASON) }}
            **Timestamp:** ${{ needs.setup.outputs.timestamp }}
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### What Changed
            All non-optional `.DURATION` files have been regenerated across ${{ needs.setup.outputs.num_batches }} parallel benchmark batches.

            ### Review Checklist
            - [ ] Verify no unexpected test failures in the workflow logs
            - [ ] Check that duration values are reasonable (no extreme outliers)
            - [ ] Confirm all expected tests have `.DURATION` files
            - [ ] Review artifacts for any test failures or warnings

            ### Artifacts
            - Combined sync logs: `monthly-duration-sync-log-${{ needs.setup.outputs.timestamp }}`
            - Individual batch logs: `benchmark-log-*-batch-*`

            ---
            🤖 This PR was automatically generated by the monthly duration sync workflow.
          labels: |
            automation
            maintenance
          assignees: ${{ github.repository_owner }}

      - name: Summary
        if: ${{ always() }}
        run: |
          echo "## 📊 Monthly Duration Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** ${{ needs.setup.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name == 'schedule' && '⏰ Automated monthly cron' || format('👤 Manual trigger: {0}', env.REASON) }}" >> $GITHUB_STEP_SUMMARY
          echo "**Parallel Batches:** ${{ needs.setup.outputs.num_batches }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.changes.outputs.changes }}" == "true" ]; then
            echo "✅ **Status:** PR created with updated .DURATION files" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Status:** No changes detected, PR not created" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Clean up ALL intermediate artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118
        with:
          name: |
            benchmark-*
            duration-files-*
            compile-and-buildcheck-log-*
          failOnError: false
